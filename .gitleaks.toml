title = "LURIA - Gitleaks secret scanning"

# Keep bundled detection rules. Do not ignore entire files or paths.
[extend]
useDefault = true

# Allow only known, non-secret literal values; keep all other default rules.
[allowlist]
description = "Public Supabase identifiers and non-secret calculator preference key"
regexTarget = "secret"
regexes = [
  '''^sb_publishable_[A-Za-z0-9_-]{20,}$''',
  '''^luria_calc_favorites_v1$'''
]
