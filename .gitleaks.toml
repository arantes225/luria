title = "LURIA - Gitleaks secret scanning"

# Keep bundled detection rules. Do not ignore entire files or paths.
[extend]
useDefault = true

# Allow only explicit known public identifiers and nonsecret localStorage keys.
[allowlist]
description = "Public identifiers and browser localStorage keys"
regexTarget = "secret"
regexes = [
  '''^sb_publishable_[A-Za-z0-9_-]{20,}$''',
  '''^luria_calc_favorites_v1$''',
  '''^luria_plantoes_shifts_v1$''',
  '''^luria_plantoes_institutions_v1$'''
]
