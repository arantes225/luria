title = "LURIA - Gitleaks secret scanning"

# A local config must explicitly inherit the bundled detection rules.
# Never ignore entire source/report directories to silence a finding.
[extend]
useDefault = true

# Supabase publishable keys are client-side project identifiers, not private credentials.
# Match only the full extracted value, never arbitrary text or file paths.
[allowlist]
description = "Supabase publishable keys (public by design)"
regexTarget = "secret"
regexes = [
  '''^sb_publishable_[A-Za-z0-9_-]{20,}$'''
]
