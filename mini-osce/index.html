<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Mini-OSCE · LURIA</title>
  <link rel="manifest" href="/manifest.webmanifest?v=5">
  <link rel="icon" type="image/png" href="/assets/img/logos/logo-icone-original.png">
  <link rel="stylesheet" href="/assets/css/style.css?v=16.12-no-legacy-dashboard">
  <link rel="stylesheet" href="/assets/css/luria-brand-v5.css?v=59-content-aligned">
  <style>
    .osce-wrap{max-width:1180px;margin:0 auto;padding:14px 0 32px}.osce-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface);margin-bottom:12px}.osce-hero h2{margin:3px 0 5px;font-size:20px}.osce-hero p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}.osce-kicker{font-size:8px;font-weight:900;color:var(--accent);letter-spacing:.08em}.osce-filter{display:flex;gap:8px;flex-wrap:wrap}.osce-filter select,.osce-filter input{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:9px;font:700 9px var(--font-ui,Inter,sans-serif)}.osce-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.osce-card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:13px;display:flex;flex-direction:column;gap:8px}.osce-card small{color:var(--muted);font-size:8px}.osce-card h3{margin:0;font-size:11px;line-height:1.35}.osce-tags{display:flex;gap:5px;flex-wrap:wrap}.osce-tag{font-size:7.5px;font-weight:850;background:var(--accent-soft);color:var(--accent);padding:4px 6px;border-radius:999px}.osce-card button,.osce-btn{margin-top:auto;border:0;border-radius:9px;background:var(--accent);color:#fff;padding:9px 10px;font:850 9px var(--font-ui,Inter,sans-serif);cursor:pointer}.osce-station{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}.osce-paper,.osce-panel{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px}.osce-paper h2{margin:5px 0 8px;font-size:18px}.osce-paper p{font-size:10px;line-height:1.55}.osce-timer{font-size:26px;font-weight:900}.osce-task{padding:11px;border-radius:10px;background:var(--surface-2);margin:10px 0}.osce-task li{font-size:9px;line-height:1.55;margin:4px 0}.osce-checklist{display:grid;gap:7px}.osce-check{display:flex;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--border);border-radius:9px;font-size:9px}.osce-check input{margin-top:2px}.osce-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.osce-secondary{background:var(--surface-2)!important;color:var(--text)!important;border:1px solid var(--border)!important}.osce-score{font-size:32px;font-weight:950;color:var(--accent)}.osce-empty{padding:20px;border:1px dashed var(--border);border-radius:12px;text-align:center;color:var(--muted);font-size:10px}
    @media(max-width:900px){.osce-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.osce-station{grid-template-columns:1fr}}@media(max-width:600px){.osce-grid{grid-template-columns:1fr}.osce-hero{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body data-page="mini-osce">
<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside><div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <main class="main"><div class="page">
    <header class="topbar"><button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button><div class="page-heading"><span class="eyebrow">PRÁTICA CLÍNICA</span><h1>Mini-OSCE</h1></div></header>
    <div id="osce-root" class="osce-wrap">
      <section class="osce-hero"><div><span class="osce-kicker">ESTAÇÕES OBJETIVAS</span><h2>Treine raciocínio e comunicação em formato OSCE.</h2><p>Até 60 casos ativos do Simulador são reaproveitados como estações curtas, com tarefas, tempo e checklist.</p></div><div class="osce-filter"><input id="osce-search" type="search" placeholder="Buscar caso"><select id="osce-specialty"><option value="">Todas as áreas</option></select></div></section>
      <div id="osce-grid" class="osce-grid"><div class="osce-empty">Carregando estações...</div></div>
    </div>
  </div></main>
</div>
<script src="/assets/vendor/supabase-2.110.6.js"></script>
<script src="/assets/js/supabase.js"></script>
<script src="/assets/js/app.js?v=20261002-command-center"></script>
<script>
(()=>{
 const sb=window.supabaseClient,$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 const state={cases:[],current:null,timer:null,seconds:480};
 function title(x){return x.title||x.presentation?.display_title||x.presentation?.chief_complaint||"Caso clínico"}
 function area(x){return x.specialty||"Clínica Médica"}
 function tasks(x){const complaint=x.presentation?.chief_complaint||x.summary||"Paciente em avaliação";return ["Realize uma anamnese dirigida ao problema apresentado.","Diga os principais achados que buscaria no exame físico.","Apresente sua hipótese diagnóstica principal e diferenciais.","Defina exames complementares e a conduta inicial.","Explique ao paciente a próxima etapa de forma clara e segura."]}
 function checks(x){return ["Identifica os dados clínicos prioritários.","Organiza a anamnese de forma direcionada.","Busca sinais de gravidade no exame físico.","Formula hipótese coerente com o caso.","Propõe investigação compatível com a hipótese.","Define conduta inicial segura e objetiva.","Comunica o plano com clareza."]}
 function renderList(){const q=$("#osce-search").value.trim().toLowerCase(),sp=$("#osce-specialty").value;const list=state.cases.filter(x=>(!sp||area(x)===sp)&&(!q||[title(x),area(x),x.summary,x.presentation?.chief_complaint].join(" ").toLowerCase().includes(q)));$("#osce-grid").innerHTML=list.length?list.map((x,i)=>'<article class="osce-card"><small>ESTAÇÃO '+String(i+1).padStart(2,"0")+'</small><h3>'+esc(title(x))+'</h3><div class="osce-tags"><span class="osce-tag">'+esc(area(x))+'</span><span class="osce-tag">'+esc(x.difficulty||"Intermediária")+'</span></div><small>'+esc(x.summary||x.presentation?.chief_complaint||"Estação clínica derivada do Simulador.")+'</small><button type="button" data-osce="'+esc(x.id)+'">Iniciar estação</button></article>').join(""):'<div class="osce-empty">Nenhuma estação encontrada.</div>';document.querySelectorAll("[data-osce]").forEach(b=>b.onclick=()=>start(b.dataset.osce))}
 function start(id){state.current=state.cases.find(x=>String(x.id)===String(id));state.seconds=480;clearInterval(state.timer);const x=state.current;$("#osce-root").innerHTML='<section class="osce-station"><article class="osce-paper"><span class="osce-kicker">MINI-OSCE · 8 MINUTOS</span><h2>'+esc(title(x))+'</h2><p><b>Cenário:</b> '+esc(x.presentation?.chief_complaint||x.summary||"Você está atendendo este paciente em uma estação clínica.")+'</p><div class="osce-task"><b>Tarefas da estação</b><ol>'+tasks(x).map(t=>'<li>'+esc(t)+'</li>').join("")+'</ol></div><div class="osce-actions"><button class="osce-btn osce-secondary" id="osce-back">← Sair</button><button class="osce-btn" id="osce-finish">Finalizar estação</button></div></article><aside class="osce-panel"><span class="osce-kicker">TEMPO RESTANTE</span><div id="osce-timer" class="osce-timer">08:00</div><hr style="border:0;border-top:1px solid var(--border);margin:14px 0"><b style="font-size:10px">Checklist</b><div class="osce-checklist">'+checks(x).map((c,i)=>'<label class="osce-check"><input type="checkbox" data-check="'+i+'"><span>'+esc(c)+'</span></label>').join("")+'</div></aside></section>';$("#osce-back").onclick=()=>location.reload();$("#osce-finish").onclick=finish;state.timer=setInterval(()=>{state.seconds=Math.max(0,state.seconds-1);const m=Math.floor(state.seconds/60),s=state.seconds%60;const t=$("#osce-timer");if(t)t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(!state.seconds){clearInterval(state.timer);finish()}},1000)}
 function finish(){clearInterval(state.timer);const checked=document.querySelectorAll("[data-check]:checked").length,total=document.querySelectorAll("[data-check]").length,score=total?Math.round(checked/total*100):0;$("#osce-root").innerHTML='<section class="osce-paper"><span class="osce-kicker">DEBRIEFING</span><h2>'+esc(title(state.current))+'</h2><div class="osce-score">'+score+'%</div><p>'+checked+' de '+total+' itens do checklist foram contemplados.</p><div class="osce-task"><b>Fechamento</b><p>Revise os itens não marcados e compare sua sequência com o raciocínio clínico esperado. O objetivo é organizar anamnese, gravidade, hipótese, investigação, conduta e comunicação.</p></div><div class="osce-actions"><button class="osce-btn" onclick="location.reload()">Nova estação</button><a class="osce-btn osce-secondary" href="/plantao/" style="text-decoration:none">Ir ao Simulador</a></div></section>'}
 async function load(){let r=await sb.rpc("list_active_clinical_case_summaries");if(r.error)r=await sb.from("clinical_cases").select("id,slug,title,setting,specialty,difficulty,summary,presentation,version").eq("active",true).order("title").limit(60);state.cases=(r.data||[]).slice(0,60);const specs=[...new Set(state.cases.map(area))].sort((a,b)=>a.localeCompare(b,"pt-BR"));$("#osce-specialty").innerHTML='<option value="">Todas as áreas</option>'+specs.map(s=>'<option>'+esc(s)+'</option>').join("");$("#osce-search").oninput=renderList;$("#osce-specialty").onchange=renderList;renderList()}
 load().catch(()=>{$("#osce-grid").innerHTML='<div class="osce-empty">Não foi possível carregar as estações agora.</div>'})
})();
</script>
</body></html>
