      <section class="osce-hero"><div><span class="osce-kicker">ESTAÇÕES INTERATIVAS</span><h2>Treine como se estivesse dentro da estação.</h2><p>Converse com o paciente em linguagem natural, faça o exame, solicite exames e defina a conduta. O checklist fica oculto e só entra na correção.</p></div><div class="osce-filter"><input id="osce-search" type="search" placeholder="Buscar caso"><div id="osce-area-switches" class="osce-area-switches" aria-label="Filtrar OSCE por área"></div></div></section>

<script>
(()=>{
 const sb=window.supabaseClient,$=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
 const state={cases:[],current:null,timer:null,seconds:480,area:"",performed:new Set(),log:[],tab:"anamnese",full:null};
 function norm(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim()}
 function title(x){return x.title||x.presentation?.display_title||x.presentation?.chief_complaint||"Caso clínico"}
 function area(x){return x.specialty||"Clínica Médica"}
 function canonicalArea(v){const n=norm(v);if(n.includes("pedi"))return "Pediatria";if(n.includes("cirurg"))return "Cirurgia Geral";if(n.includes("gine")||n.includes("obst"))return "Ginecologia e Obstetrícia";if(n.includes("prevent")||n.includes("saude coletiva"))return "Preventiva";return "Clínica Médica"}
 function renderAreaSwitches(){const areas=["","Clínica Médica","Pediatria","Cirurgia Geral","Ginecologia e Obstetrícia","Preventiva"];$("#osce-area-switches").innerHTML=areas.map(a=>'<button type="button" class="osce-area-switch'+(state.area===a?' active':'')+'" data-osce-area="'+esc(a)+'">'+(a||"Todas")+'</button>').join("");document.querySelectorAll("[data-osce-area]").forEach(b=>b.onclick=()=>{state.area=b.dataset.osceArea||"";renderAreaSwitches();renderList()})}
 function renderList(){const q=$("#osce-search").value.trim().toLowerCase(),sp=state.area;const list=state.cases.filter(x=>(!sp||canonicalArea(area(x))===sp)&&(!q||[title(x),area(x),x.summary,x.presentation?.chief_complaint].join(" ").toLowerCase().includes(q)));$("#osce-grid").innerHTML=list.length?list.map((x,i)=>'<article class="osce-card"><small>ESTAÇÃO '+String(i+1).padStart(2,"0")+'</small><h3>'+esc(title(x))+'</h3><div class="osce-tags"><span class="osce-tag">'+esc(canonicalArea(area(x)))+'</span><span class="osce-tag">'+esc(x.difficulty||"Intermediária")+'</span></div><small>'+esc(x.presentation?.chief_complaint||x.summary||"Estação clínica interativa.")+'</small><button type="button" data-osce="'+esc(x.id)+'">Entrar na estação</button></article>').join(""):'<div class="osce-empty">Nenhuma estação encontrada.</div>';document.querySelectorAll("[data-osce]").forEach(b=>b.onclick=()=>start(b.dataset.osce))}
 function cat(a){const c=norm(a.category);if(c.includes("anamn"))return "anamnese";if(c==="exame"||c.includes("exame fis"))return "exame";if(c.includes("labor")||c.includes("imagem")||c==="exames")return "exames";if(c.includes("proced")||c.includes("trat")||c.includes("iniciais"))return "condutas";return "outros"}
 function tabs(){return [["anamnese","Anamnese"],["exame","Exame físico"],["exames","Exames"],["condutas","Condutas"],["outros","Outros"]]}
 function vitalsHtml(x){const v=x.initial_vitals||{};const rows=[["PA",v.bp||"—"],["FC",v.hr?String(v.hr)+" bpm":"—"],["FR",v.rr?String(v.rr)+" irpm":"—"],["SpO₂",v.spo2?String(v.spo2)+"%":"—"],["Temp.",v.temp!=null?String(v.temp)+" °C":"—"],["Estado",v.mental||"—"]];return rows.map(r=>'<div class="osce-vital"><small>'+r[0]+'</small><b>'+esc(r[1])+'</b></div>').join("")}
 function opening(x){return x.presentation?.opening||x.presentation?.chief_complaint||x.summary||"Paciente aguarda sua avaliação."}
 function patientMeta(x){return [x.presentation?.age,x.presentation?.sex].filter(Boolean).join(" · ")||"Paciente da estação"}
 function avatar(x){const s=norm(x.presentation?.sex),a=parseInt(String(x.presentation?.age||"").match(/\d+/)?.[0]||"30",10);if(a<16)return s.includes("fem")?"👧":"👦";if(a>=60)return s.includes("fem")?"👵":"👴";return s.includes("fem")?"👩":"👨"}
 function renderLog(){const el=$("#osce-log");if(!el)return;el.innerHTML=state.log.length?state.log.map(m=>'<div class="osce-bubble '+m.who+'">'+esc(m.text)+'</div>').join(""):'<div class="osce-bubble system">Você entrou na estação. Comece conduzindo a consulta.</div>';el.scrollTop=el.scrollHeight}
 function words(v){return norm(v).replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!["qual","quais","como","voce","voces","para","esta","esse","essa","isso","uma","uns","das","dos","que","tem","teve","com"].includes(w))}
 function conceptTokens(q){const n=norm(q),out=new Set(words(q));const groups=[
   [/quando|comec|inicio|iniciou|tempo/,["inicio","onset","duracao","tempo","comecou"]],
   [/quanto tempo|duracao|desde quando/,["duracao","tempo","inicio"]],
   [/cor|colorac/,["cor","coloracao","aspecto"]],
   [/quanto|quantidade|volume|muito|pouco/,["quantidade","volume","intensidade"]],
   [/semana|gesta|gravidez|ig\b/,["gestacao","gestacional","semanas","gravidez"]],
   [/dor|doi|dolor/,["dor","dolorosa","intensidade","localizacao"]],
   [/onde|local|localiza/,["localizacao","local"]],
   [/febre|temperatura/,["febre","temperatura"]],
   [/alerg/,["alergia","alergias"]],
   [/remedio|medic|usa|toma/,["medicacao","medicacoes","medicamento"]],
   [/doenca|anteced|historico|comorb/,["antecedentes","comorbidades","historico"]],
   [/sangra|sangramento|sangue/,["sangramento","sangue","hemorragia"]],
   [/movimento fetal|mexendo|mexe/,["movimentos","fetais","fetal"]],
   [/perda.*liquido|liquido/,["liquido","amniorrexe","bolsa"]],
   [/contrac/,["contracoes","contracao"]]
 ];groups.forEach(([re,arr])=>{if(re.test(n))arr.forEach(x=>out.add(x))});return [...out]}
 function actionScore(a,q){const qt=conceptTokens(q),txt=norm([a.id,a.label,a.subgroup,a.category].join(" "));let sc=0;qt.forEach(t=>{if(txt.includes(t))sc+=t.length>6?3:2});const qn=norm(q);if(qn&&txt.includes(qn))sc+=8;return sc}
 function hiddenFieldAnswer(q){const p=state.full?.presentation||{},n=norm(q);const entries=Object.entries(p).filter(([,v])=>["string","number"].includes(typeof v));const aliases=[
   [/semana|gesta|gravidez|ig\b/,/gest|semana|grav|ig/i],
   [/idade\b/,/^age$|idade/i],
   [/sexo|genero/,/sex|sexo/i],
   [/queixa|motivo|sintoma principal/,/chief|complaint|queixa/i]
 ];for(const [qre,kre] of aliases){if(qre.test(n)){const hit=entries.find(([k])=>kre.test(k));if(hit)return String(hit[1])}}return ""}
 function answerTypedQuestion(q){const actions=(state.full?.actions||[]).filter(a=>cat(a)==="anamnese");const ranked=actions.map(a=>({a,score:actionScore(a,q)})).sort((x,y)=>y.score-x.score);const best=ranked[0];state.log.push({who:"user",text:q});if(best&&best.score>=2){state.performed.add(best.a.id);let result=best.a.result||"Paciente responde à pergunta.";const v=state.full.initial_vitals||{};result=result.replace(/{{bp}}/g,v.bp||"—").replace(/{{hr}}/g,v.hr||"—").replace(/{{rr}}/g,v.rr||"—").replace(/{{spo2}}/g,v.spo2||"—").replace(/{{mental}}/g,v.mental||"—");state.log.push({who:"patient",text:result})}else{const direct=hiddenFieldAnswer(q);state.log.push({who:"patient",text:direct||"Não entendi exatamente o que você quer saber. Tente perguntar de outra forma ou seja mais específico."})}renderLog()}
 function renderOptions(){const box=$("#osce-options");if(!box||!state.full)return;if(state.tab==="anamnese"){box.innerHTML='<form id="osce-chat-form" class="osce-chat-form" style="grid-column:1/-1"><input id="osce-chat-input" class="osce-chat-input" type="text" autocomplete="off" placeholder="Pergunte ao paciente: Quando começou? Qual a cor do sangramento? Quantas semanas de gestação?"><button class="osce-chat-send" type="submit">Perguntar</button></form><div class="osce-chat-hint">Digite como você perguntaria na estação. O paciente só revela o que for perguntado.</div>';const form=$("#osce-chat-form"),input=$("#osce-chat-input");form.onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(!q)return;answerTypedQuestion(q);input.value="";input.focus()};return}const actions=(state.full.actions||[]).filter(a=>cat(a)===state.tab);box.innerHTML=actions.length?actions.map(a=>'<button type="button" class="osce-option '+(state.performed.has(a.id)&&!a.repeatable?'done':'')+'" data-action="'+esc(a.id)+'" '+(state.performed.has(a.id)&&!a.repeatable?'disabled':'')+'>'+esc(a.label||a.id)+'</button>').join(""):'<div class="osce-empty" style="grid-column:1/-1">Sem ações nesta categoria.</div>';document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>perform(b.dataset.action))}
 function renderTabs(){const box=$("#osce-tool-tabs");if(!box)return;box.innerHTML=tabs().map(([id,label])=>'<button type="button" class="osce-tool-tab '+(state.tab===id?'active':'')+'" data-tab="'+id+'">'+label+'</button>').join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderTabs();renderOptions()})}
 function applyEffects(a){const eff=a.effects?.vitals;if(eff&&state.full){state.full.initial_vitals={...(state.full.initial_vitals||{}),...eff};const v=$("#osce-vitals");if(v)v.innerHTML=vitalsHtml(state.full)}}
 function perform(id){const a=(state.full.actions||[]).find(x=>String(x.id)===String(id));if(!a)return;state.performed.add(a.id);state.log.push({who:"user",text:a.label||a.id});let result=a.result||"A ação foi realizada.";const v=state.full.initial_vitals||{};result=result.replace(/{{bp}}/g,v.bp||"—").replace(/{{hr}}/g,v.hr||"—").replace(/{{rr}}/g,v.rr||"—").replace(/{{spo2}}/g,v.spo2||"—").replace(/{{mental}}/g,v.mental||"—");state.log.push({who:(cat(a)==="anamnese"?"patient":"patient"),text:result});applyEffects(a);renderLog();renderOptions()}
 async function start(id){const base=state.cases.find(x=>String(x.id)===String(id));if(!base)return;state.current=base;state.seconds=480;state.performed=new Set();state.log=[];state.tab="anamnese";clearInterval(state.timer);$("#osce-root").innerHTML='<div class="osce-empty">Preparando estação...</div>';let r=await sb.from("clinical_cases").select("*").eq("id",id).maybeSingle();state.full=r.data||base;const x=state.full;$("#osce-root").innerHTML='<section class="osce-sim"><article class="osce-stage"><div class="osce-stage-head"><div><span class="osce-kicker">ESTAÇÃO OSCE · 8 MINUTOS</span><h2>'+esc(title(x))+'</h2></div><div id="osce-timer" class="osce-timer">08:00</div></div><div class="osce-patient"><div class="osce-avatar">'+avatar(x)+'</div><div><h3>'+esc(x.presentation?.display_title||x.presentation?.chief_complaint||"Paciente")+'</h3><p>'+esc(patientMeta(x))+'</p><p>'+esc(opening(x))+'</p></div></div><div id="osce-log" class="osce-log"></div><div class="osce-tools"><div id="osce-tool-tabs" class="osce-tool-tabs"></div><div id="osce-options" class="osce-options"></div></div></article><aside class="osce-side"><div><span class="osce-kicker">DADOS DISPONÍVEIS</span><h3>Paciente</h3></div><div id="osce-vitals" class="osce-vitals">'+vitalsHtml(x)+'</div><div class="osce-field"><label for="osce-hyp">Hipótese diagnóstica</label><textarea id="osce-hyp" placeholder="Escreva sua hipótese principal e, se quiser, diferenciais."></textarea></div><div class="osce-field"><label for="osce-plan">Conduta final</label><textarea id="osce-plan" placeholder="Defina investigação, tratamento e destino/seguimento."></textarea></div><div class="osce-side-actions"><button type="button" class="osce-btn osce-secondary" id="osce-exit">Sair</button><button type="button" class="osce-btn osce-secondary" id="osce-reset">Recomeçar</button><button type="button" class="osce-btn" id="osce-finish">Finalizar estação</button></div></aside></section>';renderTabs();renderOptions();renderLog();$("#osce-exit").onclick=()=>location.reload();$("#osce-reset").onclick=()=>start(id);$("#osce-finish").onclick=finish;state.timer=setInterval(()=>{state.seconds=Math.max(0,state.seconds-1);const m=Math.floor(state.seconds/60),s=state.seconds%60,t=$("#osce-timer");if(t)t.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(!state.seconds){clearInterval(state.timer);finish()}},1000)}
 function finish(){clearInterval(state.timer);const x=state.full||state.current;if(!x)return;const actions=x.actions||[],ess=actions.filter(a=>a.essential||Number(a.points)>=8),hit=ess.filter(a=>state.performed.has(a.id));const bad=actions.filter(a=>state.performed.has(a.id)&&Number(a.points)<0);const positive=actions.filter(a=>state.performed.has(a.id)&&Number(a.points)>0);const actionScore=ess.length?Math.round(70*hit.length/ess.length):Math.min(70,positive.length*8);const hyp=$("#osce-hyp")?.value.trim()||"",plan=$("#osce-plan")?.value.trim()||"";const dx=x.debrief?.diagnosis||x.title||"";const hypOk=hyp&&norm(dx).split(/\s+/).filter(w=>w.length>4).some(w=>norm(hyp).includes(w));const score=Math.max(0,Math.min(100,actionScore+(hypOk?15:0)+(plan.length>25?15:0)-bad.length*5));const missing=ess.filter(a=>!state.performed.has(a.id));$("#osce-root").innerHTML='<section class="osce-debrief"><span class="osce-kicker">DEBRIEFING DA ESTAÇÃO</span><h2>'+esc(title(x))+'</h2><div class="osce-score">'+score+'%</div><p style="font-size:9px;color:var(--muted)">A correção considera as ações clínicas relevantes executadas durante a estação, hipótese e fechamento. O checklist permaneceu oculto durante o atendimento.</p><div class="osce-review"><div class="osce-review-card"><h3>O que você fez</h3><ul>'+(positive.length?positive.map(a=>'<li>'+esc(a.label)+'</li>').join(""):'<li>Nenhuma ação pontuável registrada.</li>')+'</ul></div><div class="osce-review-card"><h3>Condutas-chave que faltaram</h3><ul>'+(missing.length?missing.map(a=>'<li>'+esc(a.label)+'</li>').join(""):'<li>As principais condutas foram contempladas.</li>')+'</ul></div></div>'+(bad.length?'<div class="osce-review-card"><h3>Condutas inadequadas</h3><ul>'+bad.map(a=>'<li>'+esc(a.label)+' — '+esc(a.result||"Conduta inadequada.")+'</li>').join("")+'</ul></div>':'')+'<div class="osce-review-card" style="margin-top:10px"><h3>Fechamento esperado</h3><p style="font-size:9px;line-height:1.55;margin:0">'+esc(x.debrief?.diagnosis?("Diagnóstico: "+x.debrief.diagnosis+". "):"")+esc(x.debrief?.summary||x.presentation?.goal||"Revise a sequência clínica esperada e compare com sua abordagem.")+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button type="button" class="osce-btn" id="osce-new">Nova estação</button><button type="button" class="osce-btn osce-secondary" id="osce-retry">Refazer esta</button><a class="osce-btn osce-secondary" href="/plantao/sala-emergencia/" style="text-decoration:none">Sala de Emergência</a></div></section>';$("#osce-new").onclick=()=>location.reload();$("#osce-retry").onclick=()=>start(x.id)}
 async function load(){let r=await sb.rpc("list_active_clinical_case_summaries");if(r.error)r=await sb.from("clinical_cases").select("id,slug,title,setting,specialty,difficulty,summary,presentation,version").eq("active",true).order("title").limit(60);const all=Array.isArray(r.data)?r.data:[];state.cases=all.filter(x=>norm(x.setting)!=="aph").slice(0,60);renderAreaSwitches();$("#osce-search").oninput=renderList;renderList();const requested=new URLSearchParams(location.search).get("case");if(requested&&state.cases.some(x=>String(x.id)===String(requested)))start(requested)}
 load().catch(()=>{$("#osce-grid").innerHTML='<div class="osce-empty">Não foi possível carregar as estações agora.</div>'})
})();
</script>
