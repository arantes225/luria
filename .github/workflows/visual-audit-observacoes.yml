name: Visual audit of interface observations
on:
  pull_request:
    paths:
      - scripts/visual-audit-observacoes.cjs
      - .github/workflows/visual-audit-observacoes.yml
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chrome
        run: echo "TRAUBE_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node scripts/visual-audit-observacoes.cjs
