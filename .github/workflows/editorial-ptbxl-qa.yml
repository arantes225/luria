name: Editorial PTB-XL ECG QA - NO DEPLOY

on:
  push:
    branches:
      - editorial/lote-08-inventario-e-producao-20261014
    paths:
      - 'scripts/editorial/**'
      - '.github/workflows/editorial-ptbxl-qa.yml'

permissions:
  contents: read

jobs:
  ptbxl-review-artifact:
    name: Test WFDB and build review-only clinical ECG figures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (no site deployment)
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ECG dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.2.6 matplotlib==3.10.3 Pillow==11.3.0 pytest==8.4.1
      - name: Validate synthetic test fixtures only
        run: python -m pytest -q scripts/editorial/tests/test_ptbxl_pipeline.py
      - name: Download published PTB-XL metadata
        run: |
          mkdir -p build/editorial-ptbxl/dataset
          curl -fLsS --retry 3 --retry-delay 2 https://physionet.org/files/ptb-xl/1.0.3/ptbxl_database.csv -o build/editorial-ptbxl/dataset/ptbxl_database.csv
          curl -fLsS --retry 3 --retry-delay 2 https://physionet.org/files/ptb-xl/1.0.3/scp_statements.csv -o build/editorial-ptbxl/dataset/scp_statements.csv
      - name: Identify annotated ECG review candidates (not diagnoses)
        run: |
          python scripts/editorial/select_ptbxl_candidates.py \
            --database build/editorial-ptbxl/dataset/ptbxl_database.csv \
            --statements build/editorial-ptbxl/dataset/scp_statements.csv \
            --output build/editorial-ptbxl/review-candidates.json --per-code 1
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/editorial-ptbxl')
          doc=json.loads((root/'review-candidates.json').read_text())
          records=doc['records'][:12]
          if len(records)<8:
              raise SystemExit('Insufficient verified metadata records; fail closed')
          request=[{'ecg_id':r['ecg_id'],'learning_goal':r['learning_goal']} for r in records]
          (root/'render-requests.json').write_text(json.dumps(request,ensure_ascii=False,indent=2)+'\n')
          (root/'README-review.txt').write_text(
              'PTB-XL 1.0.3, CC BY 4.0, DOI 10.13026/kfzx-aw45. '
              'Clinical labels are unverified. Review before any publication.\n')
          PY
      - name: Fetch only selected genuine signal records
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re
          import subprocess
          root=pathlib.Path('build/editorial-ptbxl')
          requests=json.loads((root/'render-requests.json').read_text())
          for rec in requests:
              ecg_id=rec['ecg_id']
              if not re.fullmatch(r'[0-9]{5}',ecg_id):
                  raise SystemExit('Invalid record id')
              folder=f'{int(ecg_id)//1000*1000:05d}'
              dest=root/'dataset'/'records100'/folder
              dest.mkdir(parents=True,exist_ok=True)
              for ext in ('hea','dat'):
                  name=f'{ecg_id}_lr.{ext}'
                  uri=f'https://physionet.org/files/ptb-xl/1.0.3/records100/{folder}/{name}'
                  subprocess.run(['curl','-fLsS','--retry','3','--retry-delay','2',
                                  '--max-time','45','--output',str(dest/name),uri],check=True)
          PY
      - name: Render real 12-lead signals as WebP (not medically certified)
        run: |
          python scripts/editorial/render_ptbxl_ecgs.py \
            --dataset build/editorial-ptbxl/dataset \
            --manifest build/editorial-ptbxl/render-requests.json \
            --output build/editorial-ptbxl/images-REVIEW-ONLY --limit-kb 120
      - name: Check size, provenance and negative approval flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/editorial-ptbxl/images-REVIEW-ONLY')
          rows=json.loads((p/'manifesto-revisao-imagens-ptbxl.json').read_text())
          assert len(rows)>=8
          for row in rows:
              assert row['clinical_label_verified'] is False
              assert row['publication_approved'] is False
              assert row['image']['bytes']<=120*1024
              assert (p/row['file']).is_file()
          print(f'{len(rows)} real ECGs converted, none approved')
          PY
      - name: Store review-only artifact, no repository write or site publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PTBXL-ECG-REVIEW-ONLY
          path: |
            build/editorial-ptbxl/review-candidates.json
            build/editorial-ptbxl/render-requests.json
            build/editorial-ptbxl/README-review.txt
            build/editorial-ptbxl/images-REVIEW-ONLY/
          retention-days: 7
          if-no-files-found: warn
