name: Temporary production visual audit
on:
  pull_request:
    paths:
      - scripts/production-visual-audit.cjs
      - .github/workflows/production-visual-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect main Pages runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/arantes225/luria/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=8" | jq -r '.workflow_runs[] | "PAGES_RUN|\(.id)|\(.head_sha)|\(.status)|\(.conclusion)"'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Use runner Chrome
        run: echo "TRAUBE_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node scripts/production-visual-audit.cjs
