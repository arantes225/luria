name: Atualiza Status do Segundo Cérebro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gerar-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Gerar CEREBRO-STATUS.md com segurança
        run: node scripts/generate-cerebro-status.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CEREBRO-STATUS.md
          git diff --staged --quiet || git commit -m "chore: atualiza CEREBRO-STATUS.md [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
