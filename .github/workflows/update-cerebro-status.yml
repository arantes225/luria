name: Atualiza Status do Segundo Cérebro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gerar-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar CEREBRO-STATUS.md
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          COMMIT=$(git log -1 --format="%h — %s")
          BRANCH=$(git branch -r --list 'origin/*' | grep -v HEAD | sed 's|origin/||' | sort | tr '\n' ', ' | sed 's/, $//')
          PRS=$(gh pr list --state open --json number,title,headRefName 2>/dev/null | jq -r '.[] | "- PR #\(.number) `\(.headRefName)` — \(.title)"' 2>/dev/null || echo "- (sem PRs abertas)")
          MIGRATIONS=$(ls supabase/migrations/*.sql 2>/dev/null | tail -5 | xargs -I{} basename {} | sort -r | sed 's/^/- /' || echo "- (nenhuma)")
          MODULOS=$(ls trabalho/ 2>/dev/null | sed 's/^/- /' || echo "- (nenhum)")
          APOSTILAS=$(ls apostilas/ 2>/dev/null | wc -l | tr -d ' ')
          WORKFLOWS=$(ls .github/workflows/*.yml 2>/dev/null | xargs -I{} basename {} | sed 's/^/- /')

          cat > docs/CEREBRO-STATUS.md << EOF
          ---
          gerado: $DATE
          fonte: GitHub Actions (push na main)
          ---
          # Status do Repositório — $DATE

          ## Último commit
          $COMMIT

          ## Branches ativas
          $BRANCH

          ## PRs abertas
          $PRS

          ## Módulos Modo Trabalho (pasta \`trabalho/\`)
          $MODULOS

          ## Últimas migrações Supabase
          $MIGRATIONS

          ## Apostilas (total de pastas)
          $APOSTILAS pastas em \`apostilas/\`

          ## Workflows ativos
          $WORKFLOWS
          EOF

      - name: Commitar status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CEREBRO-STATUS.md
          git diff --staged --quiet || git commit -m "chore: atualiza CEREBRO-STATUS.md [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
