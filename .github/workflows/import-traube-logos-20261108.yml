name: Importar logos TRAUBE PNG
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-traube-logos-20261108.yml]
permissions:
  contents: write
jobs:
  import-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Converter PNGs aprovados em recursos locais
        env:
          BLUE_BG_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F947e462c-d7c6-416f-8a8e-8d6624f8fb9e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKKrHiI7neLB6F9tsFBvwEqD-u6_mhxrDr1w2ZBIL8Qu&exp=1794134572&osig=AAAAAAAAAAAAAAAAAAAAAAgMLw0GTtBRYOVQjCWP7dz7iXdR9kuU1FVNiPcV0mJq&signer=media-rpc&token=AAIAAU0AJDk0N2U0NjJjLWQ3YzYtNDE2Zi04YThlLThkNjYyNGY4ZmI5ZQAAAAABobrA--CaOYI3HUN6cA3YWRaMF95t6SQ6xx-UpsqYyVrAxvbiCw&x-canva-quality=thumbnail"
          BLUE_TRANSPARENT_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F94c530b2-56e0-4789-94ec-004d73d60e66/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACzVNnjng-MZRWXkc3morOYLtjLUDlZGRJpw8nv2qQE5&exp=1794136049&osig=AAAAAAAAAAAAAAAAAAAAAESx0PQOIDxN7xQ-pnFerio_a0nu_XzfT6yEERyLxeqJ&signer=media-rpc&token=AAIAAU0AJDk0YzUzMGIyLTU2ZTAtNDc4OS05NGVjLTAwNGQ3M2Q2MGU2NgAAAAABobrXhWi9-ewH8Nda4sFSnOuBhq8YJC3bSZRNvdH9JLIdpo4-iQ&x-canva-quality=thumbnail"
          PINK_TRANSPARENT_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fc664c7da-02cd-43fb-978e-b16e3d5b1cbb/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPFTHPahvCL0fifWjD2qgqcb-q0gQwEyh42kVyXhg7Rk&exp=1794136291&osig=AAAAAAAAAAAAAAAAAAAAAL6AvcZtUsxFpenj_2ajVNBluJsYKaOhgwLar9tZEc5C&signer=media-rpc&token=AAIAAU0AJGM2NjRjN2RhLTAyY2QtNDNmYi05NzhlLWIxNmUzZDViMWNiYgAAAAABobrbNricL6iY76sdpYtfRM69rLQ5-jGcXxkHeG9HXWTn5L-9IQ&x-canva-quality=thumbnail"
        run: |
          python -m pip install Pillow==11.3.0
          python - <<'PY'
          import os, urllib.request, io
          from PIL import Image
          from pathlib import Path
          dest = Path('assets/img/logos')
          dest.mkdir(parents=True, exist_ok=True)
          def fetch(key):
              req = urllib.request.Request(os.environ[key], headers={'User-Agent':'TraubeLogoImporter/1.0'})
              with urllib.request.urlopen(req, timeout=40) as response: data=response.read()
              if not data.startswith(b'\x89PNG\r\n\x1a\n'): raise ValueError('Fonte nao e PNG: '+key)
              img=Image.open(io.BytesIO(data)).convert('RGBA')
              if min(img.size)<180: raise ValueError('Fonte inesperadamente pequena: '+key)
              return img
          bluebg=fetch('BLUE_BG_URL')
          blue=fetch('BLUE_TRANSPARENT_URL')
          pink=fetch('PINK_TRANSPARENT_URL')
          # PNGs com alfa precisam preservar pixels transparentes no canto.
          for name,im in [('azul',blue),('rosa',pink)]:
              if im.getpixel((0,0))[3] > 40: raise ValueError('Transparencia perdida no PNG '+name)
          def png(im, path, size):
              im=im.resize((size,size), Image.Resampling.LANCZOS)
              im.save(dest/path, format='PNG', optimize=True)
          for name in ['logo-principal.png','logo-icone-original.png','logo-icone-azul-claro.png']:
              png(blue,name,256)
          png(pink,'logo-icone-rosa-escuro.png',256)
          png(pink,'logo-icone-rosa-claro.png',256)
          png(bluebg,'favicon.png',256)
          for size in (180,192,512):
              png(bluebg, f'pwa-icon-{size}.png', size)
          canvas=Image.new('RGBA',(512,512),'#071b4f')
          safe=blue.resize((348,348),Image.Resampling.LANCZOS)
          canvas.alpha_composite(safe, ((512-348)//2,(512-348)//2))
          canvas.save(dest/'pwa-icon-maskable-512.png',format='PNG',optimize=True)
          print('Logos instaladas:',*[p.name for p in dest.glob('*.png')])
          PY
      - name: Gravar PNGs no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/logos
          if git diff --cached --quiet; then echo 'Sem alteracoes'; exit 0; fi
          git commit -m 'assets: install updated blue and pink Traube logos'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Nao foi possivel sincronizar a branch principal' >&2
          exit 1
