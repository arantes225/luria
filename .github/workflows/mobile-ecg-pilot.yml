name: Mobile ECG capture pilot
on:
  pull_request:
    paths:
      - "mobile/ecg-pilot/**"
      - ".github/workflows/mobile-ecg-pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-privacy-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/ecg-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Privacy boundary tests
        run: npm test
      - name: Build bundled local application
        run: npm run build
      - name: Verify bundled entry point
        run: test -f dist/index.html
