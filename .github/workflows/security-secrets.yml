name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan commit changes for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      # Smoke-test the actual Gitleaks binary downloaded by the action.
      # Synthetic samples exist only in the runner; never commit a test token.
      - name: Verify secret detection with disposable samples
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_bin="$(find /tmp -maxdepth 4 -type f -name gitleaks -executable -print -quit)"
          if [[ -z "$gitleaks_bin" ]]; then
            echo "::error::Gitleaks binary not found after action execution."
            exit 1
          fi

          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/clean" "$scratch/canary/trabalho/calculadora" "$scratch/canary/apostilas/curadoria-imagens-v2"
          printf 'No credentials are in this file.\n' > "$scratch/clean/notes.txt"

          # Generate a random, invalid (unissued) GitHub-token-shaped value;
          # do not print it or save it anywhere outside the temporary runner.
          export CANARY_ROOT="$scratch/canary"
          python3 - <<'PY'
          import os, secrets, string
          from pathlib import Path
          root = Path(os.environ["CANARY_ROOT"])
          alphabet = string.ascii_letters + string.digits
          synthetic = "ghp_" + "".join(secrets.choice(alphabet) for _ in range(36))
          for relative in [
              "relatorio_seguranca.md",
              "trabalho/calculadora/index.html",
              "apostilas/curadoria-imagens-v2/curadoria-blocos-1-4-consolidada.json",
          ]:
              path = root / relative
              path.write_text("example_token = " + synthetic + "\n", encoding="utf-8")
          PY

          config="$GITHUB_WORKSPACE/.gitleaks.toml"
          if ! "$gitleaks_bin" dir --no-banner --config "$config" "$scratch/clean" > "$scratch/clean.log" 2>&1; then
            echo "::error::Gitleaks rejected benign sample or its configuration."
            exit 1
          fi

          # A nonzero exit code of exactly 42 proves a detection (not a parser error).
          set +e
          "$gitleaks_bin" dir --no-banner --config "$config" --exit-code 42 "$scratch/canary" > "$scratch/canary.log" 2>&1
          result=$?
          set -e
          if [[ "$result" -ne 42 ]]; then
            echo "::error::Gitleaks canary failed: expected detection exit code 42, got $result."
            exit 1
          fi
          echo "Gitleaks: clean sample passed and synthetic secret detected."
