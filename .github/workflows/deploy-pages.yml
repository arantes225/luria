name: Deploy GitHub Pages
# trigger: pages-source-enabled

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Check shared CSS and application routes
        run: node scripts/check-css.cjs
      - name: Test CSS ownership and legacy route aliases
        run: node --test tests/css-system.test.cjs tests/ui-routes.test.cjs tests/ui-startup.test.cjs tests/ui-final-refinement.test.cjs
      - name: Check CSP generation
        run: node scripts/sync-csp.cjs
      - name: Audit all apostilas without blocking legacy books
        run: node scripts/audit-apostilas-batch.cjs
      - name: Run deterministic frontend regressions
        run: node --test --test-isolation=none tests/stage77-functional.test.cjs tests/stage77-questions.test.cjs tests/stage77-integrity.test.cjs tests/client-persistence.test.cjs tests/quick-chart.test.cjs tests/lazy-vendors.test.cjs tests/apostilas-batch.test.cjs tests/sheetjs-mini.test.cjs
  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare optimized UI images
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reencode safe UI PNGs for the published artifact
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-static-images.py --root .
      # GitHub Pages serves the upload as publicly accessible static files.
      # Never publish SQL, server functions, test fixtures, or internal question factory data.
      - name: Prepare public-only Pages artifact
        run: |
          mkdir -p .pages-dist
          rsync -a --prune-empty-dirs \
            --exclude='/.pages-dist/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.env*' \
            --exclude='/db/' \
            --exclude='/supabase/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/tools/' \
            --exclude='/tmp/' \
            --exclude='/.tmp/' \
            --exclude='/qf-*/' \
            --exclude='/package.json' \
            --exclude='/package-lock.json' \
            --exclude='/README*' \
            ./ .pages-dist/
          test -s .pages-dist/index.html
          test -s .pages-dist/assets/js/app.js
          test -s .pages-dist/apostilas/index.html
          test -f .pages-dist/CNAME
          for folder in db supabase tests scripts tools tmp .tmp .github; do
            test ! -e ".pages-dist/$folder" || { echo "Private directory leaked: $folder"; exit 1; }
          done
          if find .pages-dist -maxdepth 1 -type d -name 'qf-*' | grep -q .; then
            echo "Internal question factory directory leaked"; exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
