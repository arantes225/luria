name: Deploy GitHub Pages
# trigger: pages-source-enabled

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Check shared CSS and application routes
        run: node scripts/check-css.cjs
      - name: Test CSS ownership and legacy route aliases
        run: node --test tests/css-system.test.cjs tests/ui-routes.test.cjs tests/ui-startup.test.cjs tests/ui-final-refinement.test.cjs
      - name: Check CSP generation
        run: node scripts/sync-csp.cjs
      - name: Validate social room permissions, client behavior and voice authorization
        run: node --test --test-isolation=none tests/social-database.test.cjs tests/social-room-features.test.cjs tests/social-voice-usage.test.cjs tests/social-ui.test.cjs tests/social-voice.test.cjs tests/social-voice-client.test.cjs tests/social-voice-site.test.cjs tests/social-pwa.test.cjs tests/social-production.test.cjs tests/stage82-ui.test.cjs tests/ui-stage22.test.cjs
      - name: Audit all apostilas without blocking legacy books
        run: node scripts/audit-apostilas-batch.cjs
      - name: Run deterministic frontend regressions
        run: node --test --test-isolation=none tests/stage77-functional.test.cjs tests/stage77-questions.test.cjs tests/stage77-integrity.test.cjs tests/client-persistence.test.cjs tests/quick-chart.test.cjs tests/lazy-vendors.test.cjs tests/apostilas-batch.test.cjs tests/sheetjs-mini.test.cjs
  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for public artifact
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare public assets only
        run: node scripts/build-pages.cjs
      - name: Prepare optimized UI images
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reencode safe UI PNGs for the published artifact
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-static-images.py --root build/pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
