name: Deploy GitHub Pages
# trigger: pages-source-enabled

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR checks can be superseded, but production uploads must finish before newer deployments.
  # Otherwise frequent commits cancel GitHub Pages during the final upload.
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Validate private recipes and protocol copy behavior
        run: node --test tests/recipe-workflow.test.cjs
      - name: Test Gestor de Plantões calendar, payments and tax estimates
        run: node --test tests/shift-manager-v2.test.cjs
      - name: Verify project Pages routes and asset paths
        run: node --test tests/pages-base-links.test.cjs
      - name: Guard public-site artifact against internal files
        run: node --test tests/public-artifact-security.test.cjs
      - name: Verify Diabetes hub, printable diary and work navigation
        run: node --test --test-isolation=none tests/work-diabetes.test.cjs tests/work-hub.test.cjs
      - name: Verify ECG normal photo and guided scanner remain independent
        run: node --test --test-isolation=none tests/ecg-normal-photo.test.cjs tests/ecg-photo-perspective.test.cjs tests/ecg-photo-canvas-regression.test.cjs tests/ecg-pwa-capture-isolation.test.cjs tests/ecg-live-paper-gate.test.cjs tests/ecg-lead-assignment-quarantine.test.cjs tests/ecg-provisional-restore.test.cjs tests/ecg-e2e-integration.test.cjs tests/ecg-physionet-benchmark.test.cjs tests/work-ecg-smart-camera.test.cjs
      - name: Check Traube bust logo files and theme mapping
        run: node --test tests/traube-bust-logo.test.cjs
      - name: Check shared CSS and application routes
        run: node scripts/check-css.cjs
      - name: Test CSS ownership and legacy route aliases
        run: node --test tests/css-system.test.cjs tests/ui-routes.test.cjs tests/ui-startup.test.cjs tests/ui-final-refinement.test.cjs
      - name: Validate Aplicar curriculum and exam radar
        run: node --test tests/curriculo.test.cjs tests/curriculo-pdf-ocr.test.cjs tests/radar.test.cjs tests/pdf-layout-profiles.test.cjs
      - name: Validate vocational quiz and live theme colors
        run: node --test tests/vocacao.test.cjs tests/vocacao-ui.test.cjs tests/vocacao-theme.test.cjs
      - name: Check CSP generation
        run: node scripts/sync-csp.cjs
      - name: Verify Notion connect controls in both libraries
        run: node --test tests/notion-library-connect.test.cjs
      - name: Validate social room permissions, client behavior and voice authorization
        run: node --test --test-isolation=none tests/social-database.test.cjs tests/social-room-features.test.cjs tests/social-voice-usage.test.cjs tests/social-ui.test.cjs tests/social-voice.test.cjs tests/social-voice-client.test.cjs tests/social-voice-site.test.cjs tests/social-pwa.test.cjs tests/social-production.test.cjs tests/social-group-community.test.cjs tests/social-group-community-ui.test.cjs tests/social-native-activities.test.cjs tests/social-native-activities-ui.test.cjs tests/stage82-ui.test.cjs tests/ui-stage22.test.cjs
      - name: Verify justified text in apostilas
        run: node --test tests/apostilas-justified-text.test.cjs
      - name: Verify typography and colored highlights in apostilas
        run: node --test tests/apostilas-reading-style.test.cjs
      - name: Verify page-like reader and chapter navigation
        run: node --test tests/apostilas-paged-reader.test.cjs
      - name: Audit all apostilas without blocking legacy books
        run: node scripts/audit-apostilas-batch.cjs
      - name: Run release-blocking frontend regressions
        run: node --test --test-isolation=none tests/stage77-functional.test.cjs tests/stage77-questions.test.cjs tests/stage77-integrity.test.cjs tests/client-persistence.test.cjs tests/quick-chart.test.cjs tests/quick-chart-ocr.test.cjs tests/quick-chart-fixed-access.test.cjs tests/lazy-vendors.test.cjs tests/sheetjs-mini.test.cjs tests/professor-alex-integration.test.cjs tests/professor-alex-startup.test.cjs tests/trabalho-exames.test.cjs tests/trabalho-exames-view.test.cjs tests/frontend-xss.test.cjs
      - name: Validate schedule block imports
        run: node --test tests/schedule-block-import.test.cjs tests/cronograma-block-integration.test.cjs tests/cronograma-activity-actions.test.cjs
  # Editorial, image-license and external pairing regressions are release gates.
  # Do not publish static pages when these safety/content checks fail.
  historical-regressions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Run outstanding editorial and external PIN tests
        run: node --test --test-isolation=none tests/apostilas-batch.test.cjs tests/quick-chart-daily-code.test.cjs tests/quick-chart-pairing.test.cjs tests/notes-independent.test.cjs
  anatomy-bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned 3D build dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts three@0.181.2 esbuild@0.25.12 playwright@1.56.1
      - name: Prepare local site for browser smoke
        run: node scripts/build-pages.cjs
      - name: Restore and verify detailed organ models
        run: node scripts/prepare-anatomy-organs.cjs build/pages/assets/models/anatomia/orgaos
      - name: Build detailed HRA models and organ viewers
        run: |
          node scripts/export-hra-organs.cjs build/hra-organ-source build/pages/assets/models/anatomia --restore
          ANATOMY_MODEL_PATH=build/pages/assets/models/anatomia/coracao.glb node scripts/build-anatomy-viewer.cjs
          node scripts/build-anatomy-organs.cjs
      - name: Check anatomical room contracts
        run: node --test tests/anatomia-room.test.cjs
      - name: Fetch pinned Human Atlas source
        run: |
          git init /tmp/luria-human-atlas
          git -C /tmp/luria-human-atlas fetch --depth 1 https://github.com/ashemag/human-atlas.git 1c38bf35c254a891200d3cedecfd57abebe83d8d
          git -C /tmp/luria-human-atlas checkout --detach FETCH_HEAD
      - name: Restore pinned anatomy sources
        id: anatomy-sources
        uses: actions/cache@v4
        with:
          path: /tmp/traube-atlas-sources
          key: traube-atlas-sources-za6c7f9016-hra110-v1
      - name: Fetch pinned anatomy sources (Z-Anatomy CC BY-SA 4.0, HRA CC BY 4.0)
        if: steps.anatomy-sources.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/traube-atlas-sources
          cd /tmp/traube-atlas-sources
          curl --fail --location --retry 3 -o za-muscles.fbx 'https://github.com/LluisV/Z-Anatomy/raw/6c7f9016bd5899ac8edafd31b9900c151df42ed6/Resources/Models/FBX/MuscularSystem100.fbx'
          curl --fail --location --retry 3 -o za-visceral.fbx 'https://github.com/LluisV/Z-Anatomy/raw/6c7f9016bd5899ac8edafd31b9900c151df42ed6/Resources/Models/FBX/VisceralSystem100.fbx'
          curl --fail --location --retry 3 -o hra-male.glb 'https://cdn.humanatlas.io/digital-objects/ref-organ/united-male/v1.10/assets/3d-vh-m-united.glb'
      - name: Verify anatomy sources
        run: |
          cd /tmp/traube-atlas-sources
          printf '%s\n' \
            '4c19df534d5d84aabbce08604306aa0485b43e8a2483c72a95b569e1dfea2279  za-muscles.fbx' \
            '22b301c93327929c9a14ee582d1848b550a950376e221a6d1078c7256bb83d0e  za-visceral.fbx' \
            'fae3ac193835e9e24cd13a0d0f11e6788183b290b0691b9b83ec81d907d94581  hra-male.glb' | sha256sum --check
      - name: Fetch pinned female reference atlas
        run: |
          git init /tmp/traube-atlas-female
          git -C /tmp/traube-atlas-female fetch --depth 1 https://github.com/slorksmo/Human-Atlas.git 5bb5713aab18d7fe9380c3339eb09f173491ea06
          git -C /tmp/traube-atlas-female checkout --detach FETCH_HEAD
      - name: Build attributed whole-body atlas
        env:
          TRAUBE_ATLAS_SOURCES: /tmp/traube-atlas-sources
          TRAUBE_ATLAS_FEMALE: /tmp/traube-atlas-female/public/models
        run: |
          npm ci --ignore-scripts --prefix /tmp/luria-human-atlas
          node scripts/build-human-atlas.cjs prepare /tmp/luria-human-atlas
          npm run check --prefix /tmp/luria-human-atlas
          node tools/anatomy-atlas/validate-atlas.mjs /tmp/luria-human-atlas
          node /tmp/luria-human-atlas/scripts/validate-interactions.mjs
          npm run build --prefix /tmp/luria-human-atlas -- --base=/aprender/anatomia/atlas/
          node scripts/build-human-atlas.cjs install /tmp/luria-human-atlas
      - name: Use the Chrome installed on the runner
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "TRAUBE_CHROME_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
      - name: Exercise 3D anatomy in browser
        run: node scripts/anatomy-browser-smoke.cjs
      - name: Exercise the detailed organ catalogue
        run: node scripts/anatomy-organs-browser-smoke.cjs
      - name: Save visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anatomy-visual-check
          path: |
            build/anatomy-exterior.png
            build/anatomy-desktop.png
            build/anatomy-mobile.png
            build/anatomy-atlas-desktop.png
            build/anatomy-atlas-mobile.png
            build/anatomy-female-body-desktop.png
            build/anatomy-female-pelvis.png
            build/anatomy-female-muscles.png
            build/anatomy-kidneys-interior.png
            build/anatomy-breasts-interior.png
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [quality, historical-regressions, anatomy-bundle]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node for public artifact
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned 3D build dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts three@0.181.2 esbuild@0.25.12
      - name: Prepare public assets only
        run: node scripts/build-pages.cjs
      - name: Restore and verify detailed organ models
        run: node scripts/prepare-anatomy-organs.cjs build/pages/assets/models/anatomia/orgaos
      - name: Build detailed HRA models and organ viewers
        run: |
          node scripts/export-hra-organs.cjs build/hra-organ-source build/pages/assets/models/anatomia --restore
          ANATOMY_MODEL_PATH=build/pages/assets/models/anatomia/coracao.glb node scripts/build-anatomy-viewer.cjs
          node scripts/build-anatomy-organs.cjs
      - name: Fetch pinned Human Atlas source
        run: |
          git init /tmp/luria-human-atlas
          git -C /tmp/luria-human-atlas fetch --depth 1 https://github.com/ashemag/human-atlas.git 1c38bf35c254a891200d3cedecfd57abebe83d8d
          git -C /tmp/luria-human-atlas checkout --detach FETCH_HEAD
      - name: Restore pinned anatomy sources
        id: anatomy-sources
        uses: actions/cache@v4
        with:
          path: /tmp/traube-atlas-sources
          key: traube-atlas-sources-za6c7f9016-hra110-v1
      - name: Fetch pinned anatomy sources (Z-Anatomy CC BY-SA 4.0, HRA CC BY 4.0)
        if: steps.anatomy-sources.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/traube-atlas-sources
          cd /tmp/traube-atlas-sources
          curl --fail --location --retry 3 -o za-muscles.fbx 'https://github.com/LluisV/Z-Anatomy/raw/6c7f9016bd5899ac8edafd31b9900c151df42ed6/Resources/Models/FBX/MuscularSystem100.fbx'
          curl --fail --location --retry 3 -o za-visceral.fbx 'https://github.com/LluisV/Z-Anatomy/raw/6c7f9016bd5899ac8edafd31b9900c151df42ed6/Resources/Models/FBX/VisceralSystem100.fbx'
          curl --fail --location --retry 3 -o hra-male.glb 'https://cdn.humanatlas.io/digital-objects/ref-organ/united-male/v1.10/assets/3d-vh-m-united.glb'
      - name: Verify anatomy sources
        run: |
          cd /tmp/traube-atlas-sources
          printf '%s\n' \
            '4c19df534d5d84aabbce08604306aa0485b43e8a2483c72a95b569e1dfea2279  za-muscles.fbx' \
            '22b301c93327929c9a14ee582d1848b550a950376e221a6d1078c7256bb83d0e  za-visceral.fbx' \
            'fae3ac193835e9e24cd13a0d0f11e6788183b290b0691b9b83ec81d907d94581  hra-male.glb' | sha256sum --check
      - name: Fetch pinned female reference atlas
        run: |
          git init /tmp/traube-atlas-female
          git -C /tmp/traube-atlas-female fetch --depth 1 https://github.com/slorksmo/Human-Atlas.git 5bb5713aab18d7fe9380c3339eb09f173491ea06
          git -C /tmp/traube-atlas-female checkout --detach FETCH_HEAD
      - name: Build attributed whole-body atlas
        env:
          TRAUBE_ATLAS_SOURCES: /tmp/traube-atlas-sources
          TRAUBE_ATLAS_FEMALE: /tmp/traube-atlas-female/public/models
        run: |
          npm ci --ignore-scripts --prefix /tmp/luria-human-atlas
          node scripts/build-human-atlas.cjs prepare /tmp/luria-human-atlas
          npm run check --prefix /tmp/luria-human-atlas
          node tools/anatomy-atlas/validate-atlas.mjs /tmp/luria-human-atlas
          node /tmp/luria-human-atlas/scripts/validate-interactions.mjs
          npm run build --prefix /tmp/luria-human-atlas -- --base=/aprender/anatomia/atlas/
          node scripts/build-human-atlas.cjs install /tmp/luria-human-atlas
      - name: Prepare optimized UI images
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reencode safe UI PNGs for the published artifact
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/optimize-static-images.py --root build/pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: '1200000'
      - name: Verify the published anatomy pages
        env:
          PUBLISHED_SITE: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PUBLISHED_SITE"
          site="${PUBLISHED_SITE%/}"
          work=$(mktemp -d)
          curl --retry 5 --retry-delay 4 --retry-all-errors -fsSL "$site/aprender/anatomia/coracao/" -o "$work/heart"
          curl --retry 5 --retry-delay 4 --retry-all-errors -fsSL "$site/aprender/anatomia/orgaos/" -o "$work/organs"
          curl --retry 5 --retry-delay 4 --retry-all-errors -fsSL "$site/aprender/anatomia/atlas/models/atlas-female.json.gz?v=traube6spatial" -o "$work/atlas"
          grep -q 'data-anatomy-vessels' "$work/heart"
          grep -q 'data-organ="brain"' "$work/organs"
          node -e 'const b=require("node:fs").readFileSync(process.argv[1]); const a=JSON.parse((b[0]===31&&b[1]===139?require("node:zlib").gunzipSync(b):b).toString()); if(a.sex!=="female"||a.parts.length<1200||a.spatialRegistration?.version!==1)process.exit(1);' "$work/atlas"
