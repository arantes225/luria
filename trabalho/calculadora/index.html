.calc-page{max-width:980px;margin:auto}.calc-intro{margin:0 0 16px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:9px 14px;font:inherit}.chip.active{background:#184888;color:#fff;border-color:#184888}.group{margin:18px 0 26px}.group-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.group-head h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}.count{background:var(--surface-2);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px}.calc-list{display:grid;gap:9px}.calc-card{width:100%;display:grid;grid-template-columns:72px 1fr 28px;align-items:center;min-height:88px;padding:0;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);overflow:hidden;text-align:left}.calc-code{height:100%;display:grid;place-items:center;border-left:5px solid #184888;color:#184888;font-weight:700;letter-spacing:.03em}.calc-copy{padding:14px 10px}.calc-copy strong{display:block;font-size:17px}.calc-copy span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.arrow{font-size:28px;color:var(--muted)}.panel{display:none;margin:10px 0 18px;padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.panel.open{display:block}.panel h3{margin:0 0 5px}.formula{font-size:12px;color:var(--muted);margin-bottom:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;min-height:44px;border:1px solid var(--border);border-radius:11px;padding:9px 11px;background:var(--surface-2);color:var(--text);font:inherit}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.go{background:#184888;color:#fff}.clear{background:var(--surface-2);color:var(--text)}.result{display:none;margin-top:14px;padding:14px;border-radius:12px;background:var(--surface-2)}.result.show{display:block}.result b{font-size:22px}.result small{display:block;color:var(--muted);margin-top:4px}.err{color:#b42318;font-size:13px;margin-top:8px}.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.45}@media(max-width:600px){.page{padding-left:14px;padding-right:14px}.fields{grid-template-columns:1fr}.calc-card{grid-template-columns:64px 1fr 24px}.calc-copy strong{font-size:16px}}

<body data-page="trabalho_calculadora"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><div id="sidebar-backdrop" class="sidebar-backdrop"></div><main class="main"><div class="page calc-page"><header class="topbar"><button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button><div class="page-heading"><span class="eyebrow" data-page-eyebrow></span><h1 data-page-title>Calculadoras</h1></div></header>
<p class="calc-intro">Cálculos clínicos rápidos. Os resultados auxiliam a decisão e devem ser interpretados no contexto do paciente.</p><nav class="chips" id="chips"></nav><div id="catalog"></div></div></main></div>
<script>
const C=[
['Renal','TFG','TFG estimada (CKD-EPI 2021)','Função renal estimada','egfr'],
['Renal','CRCL','Clearance de creatinina (Cockcroft–Gault)','Estimativa de depuração em mL/min','crcl'],
['Renal','FEN','Fração de excreção de sódio (FENa)','Avaliação tubular renal','fena'],
['Renal','FEU','Fração de excreção de ureia (FEUreia)','Avaliação tubular renal','feurea'],
['Renal','CCY','TFG creatinina + cistatina C','CKD-EPI 2021 combinada','egfrcys'],
['Cardiovascular','PAM','Pressão Arterial Média','Perfusão arterial','pam'],
['Cardiovascular','IC','Índice de Choque','Frequência cardíaca / PAS','shock'],
['Cardiovascular','QTC','QT Corrigido','Bazett, Fridericia, Framingham e Hodges','qtc'],
['Cardiovascular','PP','Pressão de Pulso','PAS − PAD','pp'],
['Metabólico','AG','Ânion Gap','Avaliação ácido-base','ag'],
['Metabólico','WIN','Fórmula de Winter','PaCO₂ esperada na acidose metabólica','winter'],
['Metabólico','H2O','Déficit de Água Livre','Estimativa na hipernatremia','freewater'],
['Metabólico','AGC','Ânion Gap corrigido','Correção pela albumina','agc'],
['Metabólico','NA','Sódio corrigido','Correção na hiperglicemia','nac'],
['Metabólico','OSM','Osmolaridade calculada','Osmolaridade plasmática','osm'],
['Metabólico','OG','Gap Osmolar','Osmolalidade medida − calculada','ogap'],
['Metabólico','DR','Delta Ratio','Análise de acidose metabólica','delta'],
['Metabólico','CA','Cálcio corrigido','Correção pela albumina','calcio'],
['Metabólico','EAG','HbA1c → Glicemia média','Glicemia média estimada (eAG)','eag'],
['Metabólico','LDL','LDL calculado (Friedewald)','Colesterol LDL estimado','ldl'],
['Antropometria','IMC','IMC','Relação entre peso e altura','imc'],
['Antropometria','SC','Superfície Corporal','Fórmula de Mosteller','bsa'],
['Antropometria','PI','Peso Ideal','Fórmula de Devine','ibw'],
['Antropometria','PAJ','Peso Ajustado','Para cálculos dependentes de peso','abw'],
['Respiratório','PF','Relação PaO₂/FiO₂','Índice de oxigenação','pf'],
['Respiratório','ROX','Índice ROX','(SpO₂/FiO₂) / frequência respiratória','rox'],
['Respiratório','SF','Relação SpO₂/FiO₂','Índice não invasivo de oxigenação','sf'],
['Respiratório','PBW','Peso Predito Ventilatório','Baseado em sexo e altura','pbw'],
['Respiratório','DP','Driving Pressure','Pressão de platô − PEEP','dp'],
['Respiratório','CST','Complacência Estática','VT / (Pplat − PEEP)','cstat'],
['Pediatria','HS','Manutenção 4-2-1','Fluidos pediátricos por peso','hs'],
['Pediatria','SCH','TFG pediátrica (Schwartz)','Estimativa rápida 1–17 anos','schwartz'],
['Pediatria','GIR','Taxa de infusão de glicose','GIR em mg/kg/min','gir'],
['Obstetrícia','IG','Idade Gestacional','Calculada pela DUM','ig'],
['Obstetrícia','DPP','Data Provável do Parto','Regra de Näegele','dpp'],
['Conversores','GTS','mL/h ↔ gotas/min','Equipo macro/microgotas','gts'],
['Conversores','MGM','% → mg/mL','Concentração de soluções','mgm'],
['Conversores','MCG','mg ↔ mcg','Conversão de massa','mcg'],
['Conversores','MMOL','Glicose mg/dL ↔ mmol/L','Conversão laboratorial','mmol'],
['Conversores','TEMP','°C ↔ °F','Conversão de temperatura','temp'],
['Infusão','DML','Dose → mL','Dose prescrita e concentração','doseml'],
['Infusão','DKG','Dose por peso','mg/kg/dose → dose total','dosekg'],
['Infusão','DIU','Diurese por peso','mL/kg/h','diurese'],
['Infusão','MKG','mcg/kg/min → mL/h','Infusão contínua por peso','mkg']
];
const defs={
egfr:{fields:[['cr','Creatinina sérica','number','mg/dL'],['age','Idade','number','anos'],['sex','Sexo','select','Feminino|Masculino']],formula:'CKD-EPI 2021 (creatinina, sem raça)',calc:v=>{let cr=+v.cr,a=+v.age,f=v.sex==='Feminino',k=f?.7:.9,alpha=f?-.241:-.302;return [142*Math.pow(Math.min(cr/k,1),alpha)*Math.pow(Math.max(cr/k,1),-1.2)*Math.pow(.9938,a)*(f?1.012:1),'mL/min/1,73 m²']}},
egfrcys:{fields:[['cr','Creatinina','number','mg/dL'],['cys','Cistatina C','number','mg/L'],['age','Idade','number','anos'],['sex','Sexo','select','Feminino|Masculino']],formula:'CKD-EPI 2021 creatinina + cistatina C',calc:v=>{let f=v.sex==='Feminino',k=f?.7:.9,a=f?-.219:-.144,x=+v.cr/k,y=+v.cys/.8;return [135*Math.pow(Math.min(x,1),a)*Math.pow(Math.max(x,1),-.544)*Math.pow(Math.min(y,1),-.323)*Math.pow(Math.max(y,1),-.778)*Math.pow(.9961,+v.age)*(f?.963:1),'mL/min/1,73 m²']}},
feurea:{fields:[['uu','Ureia urinária','number','mg/dL'],['pc','Creatinina plasmática','number','mg/dL'],['pu','Ureia plasmática','number','mg/dL'],['uc','Creatinina urinária','number','mg/dL']],formula:'FEUreia = (UreiaU × CrP) / (UreiaP × CrU) × 100',calc:v=>[(+v.uu*+v.pc)/(+v.pu*+v.uc)*100,'%']},
qtc:{fields:[['qt','QT','number','ms'],['hr','Frequência cardíaca','number','bpm'],['method','Fórmula','select','Fridericia|Bazett|Framingham|Hodges']],formula:'QTc conforme fórmula selecionada',calc:v=>{let qt=+v.qt/1000,rr=60/+v.hr,m=v.method,n=m==='Bazett'?qt/Math.sqrt(rr):m==='Fridericia'?qt/Math.cbrt(rr):m==='Framingham'?qt+.154*(1-rr):qt+1.75*(+v.hr-60)/1000;return[n*1000,'ms']}},
pp:{fields:[['pas','PAS','number','mmHg'],['pad','PAD','number','mmHg']],formula:'Pressão de pulso = PAS − PAD',calc:v=>[+v.pas-+v.pad,'mmHg']},
ogap:{fields:[['meas','Osmolalidade medida','number','mOsm/kg'],['na','Sódio','number','mEq/L'],['glu','Glicose','number','mg/dL'],['bun','BUN','number','mg/dL']],formula:'Gap = medida − (2×Na + glicose/18 + BUN/2,8)',calc:v=>[+v.meas-(2*+v.na+ +v.glu/18+ +v.bun/2.8),'mOsm/kg']},
delta:{fields:[['ag','Ânion gap','number','mEq/L'],['hco','Bicarbonato','number','mEq/L']],formula:'Delta ratio = (AG − 12) / (24 − HCO₃)',calc:v=>[(+v.ag-12)/(24-+v.hco),'']},
calcio:{fields:[['ca','Cálcio total','number','mg/dL'],['alb','Albumina','number','g/dL']],formula:'Ca corrigido = Ca + 0,8 × (4 − albumina)',calc:v=>[+v.ca+.8*(4-+v.alb),'mg/dL']},
eag:{fields:[['a1c','HbA1c','number','%']],formula:'eAG = 28,7 × HbA1c − 46,7',calc:v=>[28.7*+v.a1c-46.7,'mg/dL']},
ibw:{fields:[['h','Altura','number','cm'],['sex','Sexo','select','Feminino|Masculino']],formula:'Devine: base + 2,3 kg por polegada acima de 5 pés',calc:v=>{let inch=+v.h/2.54,base=v.sex==='Feminino'?45.5:50;return[base+2.3*(inch-60),'kg']}},
abw:{fields:[['w','Peso atual','number','kg'],['ideal','Peso ideal','number','kg']],formula:'Peso ajustado = PI + 0,4 × (peso atual − PI)',calc:v=>[+v.ideal+.4*(+v.w-+v.ideal),'kg']},
pf:{fields:[['pao','PaO₂','number','mmHg'],['fio','FiO₂','number','%']],formula:'P/F = PaO₂ / FiO₂ (fração)',calc:v=>[+v.pao/(+v.fio/100),'']},
sf:{fields:[['spo','SpO₂','number','%'],['fio','FiO₂','number','%']],formula:'S/F = SpO₂ / FiO₂ (fração)',calc:v=>[+v.spo/(+v.fio/100),'']},
pbw:{fields:[['h','Altura','number','cm'],['sex','Sexo','select','Feminino|Masculino']],formula:'ARDSNet: 45,5/50 + 0,91 × (altura cm − 152,4)',calc:v=>[(v.sex==='Feminino'?45.5:50)+.91*(+v.h-152.4),'kg']},
dp:{fields:[['plat','Pressão de platô','number','cmH₂O'],['peep','PEEP','number','cmH₂O']],formula:'Driving pressure = Pplat − PEEP',calc:v=>[+v.plat-+v.peep,'cmH₂O']},
cstat:{fields:[['vt','Volume corrente','number','mL'],['plat','Pressão de platô','number','cmH₂O'],['peep','PEEP','number','cmH₂O']],formula:'Cest = VT / (Pplat − PEEP)',calc:v=>[+v.vt/(+v.plat-+v.peep),'mL/cmH₂O']},
schwartz:{fields:[['h','Altura','number','cm'],['cr','Creatinina','number','mg/dL']],formula:'Bedside Schwartz: 0,413 × altura / creatinina',calc:v=>[.413*+v.h/+v.cr,'mL/min/1,73 m²']},
gir:{fields:[['conc','Glicose na solução','number','%'],['rate','Velocidade','number','mL/h'],['w','Peso','number','kg']],formula:'GIR = concentração (mg/mL) × mL/h / (kg × 60)',calc:v=>[(+v.conc*10*+v.rate)/(+v.w*60),'mg/kg/min']},
ig:{fields:[['dum','DUM','date','data'],['today','Data de referência','date','data']],formula:'IG = diferença entre data de referência e DUM',calc:v=>{let a=new Date(v.dum+'T00:00:00Z'),b=new Date(v.today+'T00:00:00Z'),days=Math.floor((b-a)/864e5);return[days/7,'semanas ('+Math.floor(days/7)+'s '+days%7+'d)']}},
dpp:{fields:[['dum','DUM','date','data']],formula:'DPP = DUM + 280 dias',calc:v=>{let d=new Date(v.dum+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+280);return[1,d.toLocaleDateString('pt-BR',{timeZone:'UTC'})]}},
mcg:{fields:[['mg','Massa','number','mg']],formula:'1 mg = 1000 mcg',calc:v=>[+v.mg*1000,'mcg']},
mmol:{fields:[['glu','Glicose','number','mg/dL']],formula:'Glicose mmol/L = mg/dL ÷ 18',calc:v=>[+v.glu/18,'mmol/L']},
temp:{fields:[['c','Temperatura','number','°C']],formula:'°F = °C × 9/5 + 32',calc:v=>[+v.c*9/5+32,'°F']},
doseml:{fields:[['dose','Dose desejada','number','mg'],['conc','Concentração disponível','number','mg/mL']],formula:'Volume = dose / concentração',calc:v=>[+v.dose/+v.conc,'mL']},
mkg:{fields:[['dose','Dose','number','mcg/kg/min'],['w','Peso','number','kg'],['conc','Concentração final','number','mcg/mL']],formula:'mL/h = dose × peso × 60 / concentração',calc:v=>[+v.dose*+v.w*60/+v.conc,'mL/h']},
crcl:{fields:[['age','Idade','number','anos'],['w','Peso','number','kg'],['cr','Creatinina sérica','number','mg/dL'],['sex','Sexo','select','Feminino|Masculino']],formula:'Cockcroft–Gault: ((140 − idade) × peso) / (72 × Cr); × 0,85 se feminino',calc:v=>[((140-+v.age)*+v.w)/(72*+v.cr)*(v.sex==='Feminino'?.85:1),'mL/min']},
shock:{fields:[['hr','Frequência cardíaca','number','bpm'],['pas','PAS','number','mmHg']],formula:'Índice de choque = FC / PAS',calc:v=>[+v.hr/+v.pas,'']},
winter:{fields:[['hco','Bicarbonato','number','mEq/L']],formula:'PaCO₂ esperada = 1,5 × HCO₃ + 8 (faixa ±2 mmHg)',calc:v=>{let n=1.5*+v.hco+8;return[n,'mmHg · faixa '+(n-2).toFixed(1)+'–'+(n+2).toFixed(1)]}},
freewater:{fields:[['w','Peso','number','kg'],['na','Sódio sérico','number','mEq/L'],['factor','Fator de água corporal total','select','0.60 adulto masculino|0.50 adulta feminina|0.45 idoso/baixa massa']],formula:'Déficit de água = ACT × (Na/140 − 1), com ACT = peso × fator selecionado',calc:v=>{let factor=parseFloat(v.factor);return[+v.w*factor*(+v.na/140-1),'L']}},
ldl:{fields:[['ct','Colesterol total','number','mg/dL'],['hdl','HDL-c','number','mg/dL'],['tg','Triglicerídeos','number','mg/dL']],formula:'Friedewald: LDL-c = CT − HDL-c − TG/5. Evitar quando TG ≥ 400 mg/dL.',calc:v=>{if(+v.tg>=400)throw 0;return[+v.ct-+v.hdl-(+v.tg/5),'mg/dL']}},
rox:{fields:[['spo','SpO₂','number','%'],['fio','FiO₂','number','%'],['rr','Frequência respiratória','number','irpm']],formula:'ROX = (SpO₂ / FiO₂ em fração) / FR',calc:v=>[(+v.spo/(+v.fio/100))/+v.rr,'']},
dosekg:{fields:[['dose','Dose prescrita','number','mg/kg/dose'],['w','Peso','number','kg']],formula:'Dose total = dose por kg × peso',calc:v=>[+v.dose*+v.w,'mg/dose']},
diurese:{fields:[['vol','Volume urinário','number','mL'],['w','Peso','number','kg'],['h','Intervalo','number','horas']],formula:'Diurese = volume / (peso × horas)',calc:v=>[+v.vol/(+v.w*+v.h),'mL/kg/h']},
fena:{fields:[['un','Na urinário','number','mEq/L'],['pc','Creatinina plasmática','number','mg/dL'],['pn','Na plasmático','number','mEq/L'],['uc','Creatinina urinária','number','mg/dL']],formula:'FENa = (NaU × CrP) / (NaP × CrU) × 100',calc:v=>[(+v.un*+v.pc)/(+v.pn*+v.uc)*100,'%']},
pam:{fields:[['pas','PAS','number','mmHg'],['pad','PAD','number','mmHg']],formula:'PAM ≈ (PAS + 2 × PAD) / 3',calc:v=>[(+v.pas+2*+v.pad)/3,'mmHg']},
ag:{fields:[['na','Sódio','number','mEq/L'],['cl','Cloro','number','mEq/L'],['hco','Bicarbonato','number','mEq/L']],formula:'AG = Na − (Cl + HCO₃)',calc:v=>[+v.na-(+v.cl+ +v.hco),'mEq/L']},
agc:{fields:[['na','Sódio','number','mEq/L'],['cl','Cloro','number','mEq/L'],['hco','Bicarbonato','number','mEq/L'],['alb','Albumina','number','g/dL']],formula:'AG corrigido = AG + 2,5 × (4 − albumina)',calc:v=>[(+v.na-(+v.cl+ +v.hco))+2.5*(4-+v.alb),'mEq/L']},
nac:{fields:[['na','Sódio medido','number','mEq/L'],['glu','Glicose','number','mg/dL']],formula:'Na corrigido = Na + 1,6 × ((glicose − 100) / 100)',calc:v=>[+v.na+1.6*((+v.glu-100)/100),'mEq/L']},
osm:{fields:[['na','Sódio','number','mEq/L'],['glu','Glicose','number','mg/dL'],['bun','BUN','number','mg/dL']],formula:'Osm ≈ 2×Na + glicose/18 + BUN/2,8',calc:v=>[2*+v.na+(+v.glu/18)+(+v.bun/2.8),'mOsm/kg']},
imc:{fields:[['w','Peso','number','kg'],['h','Altura','number','cm']],formula:'IMC = peso / altura²',calc:v=>[+v.w/Math.pow(+v.h/100,2),'kg/m²']},
bsa:{fields:[['w','Peso','number','kg'],['h','Altura','number','cm']],formula:'Mosteller: SC = √((altura × peso) / 3600)',calc:v=>[Math.sqrt((+v.h*+v.w)/3600),'m²']},
hs:{fields:[['w','Peso','number','kg']],formula:'4 mL/kg/h (0–10 kg) + 2 (10–20 kg) + 1 (>20 kg)',calc:v=>{let w=+v.w,r=w<=10?4*w:w<=20?40+2*(w-10):60+(w-20);return [r,'mL/h · '+Math.round(r*24)+' mL/dia']}},
gts:{fields:[['ml','Velocidade','number','mL/h'],['factor','Equipo','select','20 gotas/mL|60 microgotas/mL']],formula:'gotas/min = mL/h × fator / 60',calc:v=>[+v.ml*(v.factor.startsWith('20')?20:60)/60,v.factor.startsWith('20')?'gotas/min':'microgotas/min']},
mgm:{fields:[['pct','Concentração','number','%']],formula:'Solução X% = X g/100 mL = 10X mg/mL',calc:v=>[+v.pct*10,'mg/mL']}
};
const cats=['Todos',...new Set(C.map(x=>x[0]))],chips=document.querySelector('#chips'),catalog=document.querySelector('#catalog');let active='Todos';
function render(){chips.innerHTML=cats.map(x=>'<button class="chip '+(x===active?'active':'')+'" data-cat="'+x+'">'+x+'</button>').join('');let rows=C.filter(x=>active==='Todos'||x[0]===active),groups=[...new Set(rows.map(x=>x[0]))];catalog.innerHTML=groups.map(g=>{let a=rows.filter(x=>x[0]===g);return '<section class="group"><div class="group-head"><h2>'+g+'</h2><span class="count">'+a.length+'</span></div><div class="calc-list">'+a.map(x=>'<button class="calc-card" data-id="'+x[4]+'"><span class="calc-code">'+x[1]+'</span><span class="calc-copy"><strong>'+x[2]+'</strong><span>'+x[3]+'</span></span><span class="arrow">›</span></button><div class="panel" id="p-'+x[4]+'"></div>').join('')+'</div></section>'}).join('');bind()}
function panel(id){let d=defs[id],p=document.querySelector('#p-'+id);p.innerHTML='<h3>'+C.find(x=>x[4]===id)[2]+'</h3><div class="formula">'+d.formula+'</div><form><div class="fields">'+d.fields.map(f=>'<div class="field"><label>'+f[1]+' ('+f[3]+')</label>'+(f[2]==='date'?'<input name="'+f[0]+'" type="date" required>':f[2]==='select'?'<select name="'+f[0]+'">'+f[3].split('|').map(o=>'<option>'+o+'</option>').join('')+'</select>':'<input name="'+f[0]+'" type="number" step="any" inputmode="decimal" required>')+'</div>').join('')+'</div><div class="err"></div><div class="actions"><button class="go" type="submit">Calcular</button><button class="clear" type="reset">Limpar</button></div><div class="result" aria-live="polite"></div><div class="note">Ferramenta de apoio. Confirme dados, unidades e adequação clínica antes de utilizar o resultado.</div></form>';p.classList.add('open');let form=p.querySelector('form'),res=p.querySelector('.result'),err=p.querySelector('.err');form.addEventListener('submit',e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));if(d.fields.filter(f=>f[2]==='number').some(f=>!isFinite(+v[f[0]])||+v[f[0]]<=0)||d.fields.filter(f=>f[2]==='date').some(f=>!v[f[0]])){err.textContent='Preencha todos os valores com números válidos.';res.classList.remove('show');return}try{let [n,u]=d.calc(v);if(!isFinite(n))throw 0;err.textContent='';res.innerHTML='<b>'+n.toLocaleString('pt-BR',{maximumFractionDigits:2})+' '+u+'</b><small>Resultado calculado com os dados informados.</small>';res.classList.add('show')}catch{err.textContent='Não foi possível calcular com esses valores.'}});form.addEventListener('reset',()=>{err.textContent='';res.classList.remove('show')})}
function bind(){chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()});catalog.querySelectorAll('.calc-card').forEach(b=>b.onclick=()=>{let p=document.querySelector('#p-'+b.dataset.id);if(p.classList.contains('open'))p.classList.remove('open');else panel(b.dataset.id)})}render();
