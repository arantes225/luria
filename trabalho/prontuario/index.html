<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://sxdsfklllilhdyuamvvg.supabase.co; frame-ancestors 'none'; upgrade-insecure-requests">
  <title>Acesso temporário · LURIA</title>
  <meta name="theme-color" content="#184888">
  <link rel="icon" type="image/png" href="/assets/img/logos/logo-icone-original.png?v=favicon2">
  <link rel="stylesheet" href="/assets/css/quick-chart-external.css?v=4-notebook">
<style id="luria-page-font-lock-v57">html body,html body *{font-family:var(--font-ui,Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)!important}</style><link rel="stylesheet" href="/assets/css/work-layout.css?v=20260930">
</head>
<body data-page="trabalho_prontuario_externo">
  <main class="external-chart">
    <header class="external-head">
      <div class="external-brand">
        <img src="/assets/img/logos/logo-icone-original.png?v=luria10" alt="">
        <div><strong>LURIA</strong><span>Acesso temporário</span></div>
      </div>
      <span id="external-status" class="external-status">Acesso temporário</span>
    </header>

    <section id="external-gate" class="external-editor external-gate">
      <div class="external-title">
        <div>
          <span>Acesso temporário</span>
          <h1>Abrir caderno</h1>
        </div>
      </div>
      <p class="external-privacy">Use seu nome de usuário da LURIA e o PIN de 4 dígitos.</p>
      <label class="external-code-field">
        <span>Nome de usuário</span>
        <input id="external-username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="30" name="luria-user-code" data-lpignore="true" data-1p-ignore="true" placeholder="Ex.: luizarantes">
      </label>
      <label class="external-code-field external-pin-field">
        <span>PIN</span>
        <input id="external-pin" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" name="luria-access-code" data-lpignore="true" data-1p-ignore="true" placeholder="••••">
      </label>
      <button id="external-enter" class="external-enter" type="button">Abrir caderno</button>
      <p id="external-gate-error" class="external-gate-error" hidden></p>
    </section>

    <section id="external-error" class="external-error" hidden>
      <h1>Este acesso não está disponível</h1>
      <p id="external-error-message">Confira os dados e tente novamente.</p>
    </section>

    <section id="external-editor" class="external-editor external-notebook" hidden>
      <div class="external-title">
        <div>
          <span>Acesso temporário</span>
          <h1>Caderno</h1>
        </div>
        <small id="external-expiry"></small>
      </div>

      <div class="external-paper">
        <textarea data-chart-field="note" rows="22" spellcheck="true" autocomplete="off" placeholder="Comece a escrever..."></textarea>
      </div>

      <footer class="external-savebar">
        <span id="external-save-state">Salvo</span>
        <button id="external-clear" type="button" class="external-clear">Limpar</button>
        <button id="external-save" type="button">Salvar</button>
      </footer>
    </section>
  </main>
  <script src="/assets/js/quick-chart-external.js?v=6-notebook"></script>
</body>
</html>
