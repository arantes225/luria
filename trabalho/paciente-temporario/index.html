<!DOCTYPE html><html lang="pt-BR"><head><base href="/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paciente temporário · LURIA</title><meta name="theme-color" content="#184888"><link rel="manifest" href="/manifest.webmanifest?v=5"><link rel="stylesheet" href="/assets/css/style.css?v=16.6"><style>.clinical-card{padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}.temp-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.temp-form label{display:grid;gap:6px;font-size:12px;font-weight:800}.temp-form input,.temp-form select{min-height:42px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}.temp-actions{display:flex;gap:10px;margin-top:14px}.temp-actions button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);font-weight:800}.primary{background:var(--accent);color:#fff;border-color:var(--accent)!important}</style></head><body data-page="trabalho_paciente_temporario"><div class="app-shell"><aside id="sidebar" class="sidebar"></aside><div id="sidebar-backdrop" class="sidebar-backdrop"></div><main class="main"><div class="page"><header class="topbar"><button id="menu-open" class="menu-open" type="button">☰</button><div class="page-heading"><span class="eyebrow" data-page-eyebrow></span><h1 data-page-title></h1></div></header><p style="color:var(--muted)">Dados clínicos temporários para reaproveitar durante o atendimento, sem nome, CPF ou prontuário.</p><div class="clinical-card"><form id="temp-patient" class="temp-form">
<label>Idade<input name="age" type="number" min="0" step="1" inputmode="numeric"></label>
<label>Sexo<select name="sex"><option value="">—</option><option value="female">Feminino</option><option value="male">Masculino</option></select></label>
<label>Peso (kg)<input name="weight" type="number" min="0" step="0.1" inputmode="decimal"></label>
<label>Altura (cm)<input name="height" type="number" min="0" step="0.1" inputmode="decimal"></label>
<label>Creatinina (mg/dL)<input name="creatinine" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>Sódio (mEq/L)<input name="sodium" type="number" step="0.1" inputmode="decimal"></label>
<label>Potássio (mEq/L)<input name="potassium" type="number" step="0.1" inputmode="decimal"></label>
<label>Cloro (mEq/L)<input name="chloride" type="number" step="0.1" inputmode="decimal"></label>
<label>Bicarbonato (mEq/L)<input name="bicarbonate" type="number" step="0.1" inputmode="decimal"></label>
<label>Glicose (mg/dL)<input name="glucose" type="number" min="0" step="1" inputmode="decimal"></label>
</form><div class="temp-actions"><button class="primary" id="temp-save" type="button">Usar neste atendimento</button><button id="temp-clear" type="button">Limpar paciente</button></div><p id="temp-status" style="color:var(--muted);font-size:12px">Os dados ficam somente nesta sessão do navegador e não identificam o paciente.</p></div>
<script>(function(){const K='luria:temporary-patient:v1',f=document.getElementById('temp-patient'),s=document.getElementById('temp-status');try{const d=JSON.parse(sessionStorage.getItem(K)||'{}');Object.entries(d).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v})}catch{}document.getElementById('temp-save').onclick=()=>{const d=Object.fromEntries(new FormData(f).entries());sessionStorage.setItem(K,JSON.stringify(d));s.textContent='Paciente temporário disponível para este atendimento.';window.dispatchEvent(new CustomEvent('luria:temporary-patient',{detail:d}))};document.getElementById('temp-clear').onclick=()=>{sessionStorage.removeItem(K);f.reset();s.textContent='Paciente temporário limpo.';window.dispatchEvent(new CustomEvent('luria:temporary-patient-cleared'))}})();</script></div></main></div><script src="/assets/vendor/supabase-2.110.6.js"></script><script src="/assets/js/supabase.js"></script><script src="/assets/js/app.js?v=17.16-worktools"></script><script defer src="/assets/js/pwa.js?v=3"></script></body></html>
