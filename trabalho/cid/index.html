    .cid-page{display:grid;gap:14px}
    .cid-search-wrap{position:relative}
    .cid-search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted);pointer-events:none}

    .cid-search:focus{border-color:color-mix(in srgb,var(--primary) 68%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent)}
    .cid-status{min-height:20px;font-size:13px;color:var(--muted);padding:0 2px}
    .cid-list{display:grid;gap:8px}
    .cid-item{display:grid;grid-template-columns:minmax(78px,auto) 1fr;gap:14px;align-items:start;padding:13px 15px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
    .cid-code{font-weight:800;color:var(--primary);letter-spacing:.02em}
    .cid-name{line-height:1.42}
    .cid-empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px;background:var(--surface)}
    @media (max-width:640px){
      .cid-page{gap:12px}

<body data-page="trabalho_cid">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <main class="main">
      <div class="page">
        <header class="topbar">
          <button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button>
          <div class="page-heading"><span class="eyebrow" data-page-eyebrow></span><h1 data-page-title></h1></div>
        </header>

        <section class="cid-page" aria-label="Consulta de CID-10">
          <div class="cid-search-wrap">
            <span class="cid-search-icon" aria-hidden="true">⌕</span>
            <input id="cid-search" class="cid-search" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar por CID ou doença..." aria-label="Buscar CID por código ou doença">
          </div>
          <div id="cid-status" class="cid-status">Carregando CIDs...</div>
          <div id="cid-list" class="cid-list" aria-live="polite"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/assets/vendor/supabase-2.110.6.js"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/app.js?v=17.18-trabalho-clinico"></script>
  <script>
    (() => {
      const DATA_URL = 'https://cdn.jsdelivr.net/gh/cleytonferrari/CidDataSus@master/CIDImport/Repositorio/Resources/CID-10-SUBCATEGORIAS.CSV';
      const MAX_RESULTS = 120;
      const search = document.getElementById('cid-search');
      const status = document.getElementById('cid-status');
      const list = document.getElementById('cid-list');
      let cids = [];

      const normalize = (value) => String(value || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();

      const normalizeCode = (value) => normalize(value).replace(/[^a-z0-9]/g, '');

      const formatCode = (code) => {
        const clean = String(code || '').trim().toUpperCase();
        return clean.length > 3 ? clean.slice(0, 3) + '.' + clean.slice(3) : clean;
      };

      const parseCsvLine = (line) => {
        const out = [];
        let current = '';
        let quoted = false;
        for (let i = 0; i < line.length; i += 1) {
          const ch = line[i];
          if (ch === '"') {
            if (quoted && line[i + 1] === '"') {
              current += '"';
              i += 1;
            } else {
              quoted = !quoted;
            }
          } else if (ch === ';' && !quoted) {
            out.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
        out.push(current);
        return out;
      };

      const parseCidCsv = (text) => {
        const lines = text.replace(/\r/g, '').split('\n').filter(Boolean);
        const start = /^SUBCAT;/i.test(lines[0] || '') ? 1 : 0;
        return lines.slice(start).map((line) => {
          const cols = parseCsvLine(line);
          const code = (cols[0] || '').trim();
          const name = (cols[4] || '').trim();
          if (!code || !name) return null;
          return {
            code: formatCode(code),
            rawCode: normalizeCode(code),
            name,
            searchName: normalize(name)
          };
        }).filter(Boolean);
      };

      const render = (items, query = '') => {
        list.innerHTML = '';
        if (!items.length) {
          list.innerHTML = '<div class="cid-empty">Nenhum CID encontrado.</div>';
          status.textContent = query ? '0 resultados' : '';
          return;
        }

        const shown = items.slice(0, MAX_RESULTS);
        const fragment = document.createDocumentFragment();

        shown.forEach((item) => {
          const row = document.createElement('div');
          row.className = 'cid-item';

          const code = document.createElement('div');
          code.className = 'cid-code';
          code.textContent = item.code;

          const name = document.createElement('div');
          name.className = 'cid-name';
          name.textContent = item.name;

          row.append(code, name);
          fragment.appendChild(row);
        });

        list.appendChild(fragment);

        if (query) {
          status.textContent = items.length > MAX_RESULTS
            ? items.length.toLocaleString('pt-BR') + ' resultados · mostrando os primeiros ' + MAX_RESULTS
            : items.length.toLocaleString('pt-BR') + (items.length === 1 ? ' resultado' : ' resultados');
        } else {
          status.textContent = cids.length.toLocaleString('pt-BR') + ' CIDs carregados · mostrando os primeiros ' + Math.min(MAX_RESULTS, cids.length);
        }
      };

      const runSearch = () => {
        const query = search.value.trim();
        if (!query) {
          render(cids);
          return;
        }

        const textQuery = normalize(query);
        const codeQuery = normalizeCode(query);
        const filtered = cids.filter((item) =>
          item.rawCode.includes(codeQuery) || item.searchName.includes(textQuery)
        );
        render(filtered, query);
      };

      const load = async () => {
        try {
          const response = await fetch(DATA_URL, { cache: 'force-cache' });
          if (!response.ok) throw new Error('Falha ao carregar base CID');

          const bytes = await response.arrayBuffer();
          let text;
          try {
            text = new TextDecoder('windows-1252').decode(bytes);
          } catch (_) {
            text = new TextDecoder('iso-8859-1').decode(bytes);
          }

          cids = parseCidCsv(text);
          if (!cids.length) throw new Error('Base CID vazia');

          render(cids);
          search.disabled = false;
          search.focus({ preventScroll: true });
        } catch (error) {
          console.error('[CID] Erro ao carregar base:', error);
          status.textContent = '';
          list.innerHTML = '<div class="cid-empty">Não foi possível carregar a base de CIDs. Tente novamente em instantes.</div>';
        }
      };

      search.disabled = true;
      search.addEventListener('input', runSearch);
      load();
    })();
  </script>
  <script defer src="/assets/js/pwa.js?v=3"></script>
</body>
</html>
