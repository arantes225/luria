  <style>
    .bulario{display:grid;gap:14px}.bulario-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .bulario-search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text)}
    .bulario-count{font-size:13px;color:var(--muted)}.bulario-layout{display:grid;grid-template-columns:minmax(230px,330px) minmax(0,1fr);gap:14px;align-items:start}
    .drug-list{display:grid;gap:7px;max-height:calc(100vh - 190px);overflow:auto}.drug-row{width:100%;text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer}
    .drug-row[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.drug-row strong,.drug-row small{display:block}.drug-row small{color:var(--muted);margin-top:3px;line-height:1.35}
    .drug-detail{padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--surface);min-height:240px}.drug-detail h2{margin:4px 0;font-size:1.55rem}.drug-detail h3{margin:18px 0 9px;font-size:1.05rem}
    .drug-detail p{line-height:1.5}.drug-detail a{color:var(--accent);font-weight:700}.drug-kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}.drug-sub{color:var(--muted);margin:3px 0 14px}
    .rx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rx-field{padding:11px 13px;border:1px solid var(--border);border-radius:12px}.rx-field span{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:3px}.rx-field b{font-size:14px;line-height:1.4}
    .rx-tags,.rx-products{display:flex;flex-wrap:wrap;gap:7px}.rx-tags span,.rx-products span{padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));font-size:13px}
    .rx-presentations-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px}.rx-presentations-head h3{margin:0!important}.rx-presentations-head span{color:var(--muted);font-size:13px;font-weight:700}.rx-presentation-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:8px;margin:12px 0}.rx-presentation-tab{display:flex;align-items:flex-start;gap:9px;width:100%;min-height:64px;padding:11px 12px;text-align:left;line-height:1.3;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);cursor:pointer}.rx-presentation-tab small{flex:none;display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent);font-weight:800}.rx-presentation-tab span{font-weight:700;font-size:13px}.rx-presentation-tab[aria-selected="true"]{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));padding:10px 11px}.rx-presentation[hidden]{display:none!important}.rx-presentation{margin-top:10px!important}.rx-card{margin-top:15px;padding:16px;border:1px solid var(--border);border-radius:14px}.rx-card h3{margin-top:0}.rx-note{font-size:13px;color:var(--muted)}.rx-alert{padding:12px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface));line-height:1.45}
    .rx-controls{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.rx-controls label{display:grid;gap:5px;font-size:13px;font-weight:700}.rx-controls input,.rx-controls select{min-height:40px;width:130px;padding:8px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text)}.rx-result{font-weight:700;line-height:1.55}
    .empty{padding:20px;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}
    @media(max-width:760px){.bulario-layout{grid-template-columns:1fr}.drug-list{max-height:230px}.drug-detail{padding:16px}.rx-grid{grid-template-columns:1fr}}
