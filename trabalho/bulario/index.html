<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://sxdsfklllilhdyuamvvg.supabase.co; font-src 'self' data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' https://sxdsfklllilhdyuamvvg.supabase.co wss://sxdsfklllilhdyuamvvg.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; media-src 'self' data: blob: https://sxdsfklllilhdyuamvvg.supabase.co; frame-src 'self' blob:; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Bulário · LURIA</title>
  <meta name="theme-color" content="#184888">
  <link rel="manifest" href="/manifest.webmanifest?v=5">
  <link rel="apple-touch-icon" href="/assets/img/logos/pwa-icon-180.png?v=pwa5">
  <link rel="icon" type="image/png" href="/assets/img/logos/logo-icone-original.png?v=favicon2">
  <link rel="stylesheet" href="/assets/css/style.css?v=16.6">
  <link rel="stylesheet" href="/assets/css/luria-brand-v5.css?v=10">
  <style>
    .bulario{display:grid;gap:14px}.bulario-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .bulario-search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text)}
    .bulario-count{font-size:13px;color:var(--muted)}.drug-list{display:grid;gap:8px}
    .drug{padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
    .drug b{display:block;margin-bottom:4px}.drug small{color:var(--muted);line-height:1.4}
    .empty{padding:20px;border:1px dashed var(--border);border-radius:14px;color:var(--muted)}
  </style>
</head>
<body data-page="trabalho_bulario">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <main class="main">
      <div class="page">
        <header class="topbar">
          <button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button>
          <div class="page-heading"><span class="eyebrow" data-page-eyebrow></span><h1 data-page-title></h1></div>
        </header>
        <section class="bulario">
          <div class="bulario-head">
            <input id="drug-search" class="bulario-search" type="search" placeholder="Buscar medicamento, classe ou princípio ativo" autocomplete="off">
            <span id="drug-count" class="bulario-count"></span>
          </div>
          <div id="drug-list" class="drug-list"><div class="empty">Carregando medicamentos…</div></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/assets/vendor/supabase-2.110.6.js"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/app.js?v=17.14-tools"></script>
  <script defer src="/assets/js/pwa.js?v=3"></script>
  <script>
    (()=>{const q=document.getElementById('drug-search'),box=document.getElementById('drug-list'),count=document.getElementById('drug-count');let rows=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const draw=()=>{const t=q.value.trim().toLowerCase(),r=t?rows.filter(x=>[x.name,x.active_ingredient,x.therapeutic_class,x.pharmacological_class].some(v=>v&&v.toLowerCase().includes(t))):rows;count.textContent=`${r.length} medicamento${r.length===1?'':'s'}`;box.innerHTML=r.length?r.map(x=>`<article class="drug"><b>${esc(x.name)}</b><small>${esc(x.active_ingredient||'Princípio ativo pendente')} · ${esc(x.pharmacological_class||'Sem classe farmacológica')}<br>${esc(x.therapeutic_class||'Sem classe terapêutica')}</small></article>`).join(''):'<div class="empty">Nenhum medicamento encontrado.</div>'};
    q.addEventListener('input',draw);
    (async()=>{const {data,error}=await window.supabaseClient.from('bulario_catalog').select('id,name,active_ingredient,therapeutic_class,pharmacological_class').order('name');if(error){box.innerHTML='<div class="empty">Não foi possível carregar o Bulário.</div>';count.textContent='';return}rows=data||[];draw()})()})();
  </script>
</body>
</html>
