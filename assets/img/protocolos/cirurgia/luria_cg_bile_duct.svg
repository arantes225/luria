<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><metadata><source>PMC — Common bile duct diameter studies</source><url>https://pmc.ncbi.nlm.nih.gov/articles/PMC11147831/</url><note>Esquema didático original LURIA baseado na fonte citada; não é reprodução da figura original.</note></metadata><rect width="900" height="600" fill="#ffffff"/><rect x="0" y="0" width="900" height="10" fill="#184888"/><text x="50" y="58" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#16263d">Via biliar — calibre</text><text x="50" y="90" dy="0" font-family="Arial" font-size="17" fill="#5f6b7a">Diâmetro deve ser interpretado com idade e contexto</text><rect x="50" y="155" width="220" height="140" rx="18" fill="#eef4fb" stroke="#184888" stroke-width="2"/><text x="160.0" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">Colédoco é medido em</text><text x="160.0" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">imagem</text><line x1="310.0" y1="225" x2="332.0" y2="225" stroke="#184888" stroke-width="5"/><polygon points="332.0,225 320.0,217 320.0,233" fill="#184888"/><rect x="340.0" y="155" width="220" height="140" rx="18" fill="#eef4fb" stroke="#184888" stroke-width="2"/><text x="450.0" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">Limites variam por</text><text x="450.0" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">método/idade</text><line x1="600.0" y1="225" x2="622.0" y2="225" stroke="#184888" stroke-width="5"/><polygon points="622.0,225 610.0,217 610.0,233" fill="#184888"/><rect x="630.0" y="155" width="220" height="140" rx="18" fill="#eef4fb" stroke="#184888" stroke-width="2"/><text x="740.0" y="193" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">Pós-colecistectomia</text><text x="740.0" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#16263d">pode haver dis