<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="30" fill="#f7f9fc"/>
<text x="600" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#184888">Circuito KNDy e sintomas vasomotores</text>
<g font-family="Arial,sans-serif">
<rect x="80" y="150" width="250" height="130" rx="22" fill="#fff" stroke="#d7e0ec" stroke-width="3"/>
<text x="205" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#184888">Queda do estradiol</text>
<text x="205" y="235" text-anchor="middle" font-size="20" fill="#46566c">menopausa</text>
<path d="M330 215 H450" stroke="#184888" stroke-width="8" marker-end="url(#a)"/>
<rect x="450" y="125" width="300" height="180" rx="24" fill="#eaf2fb" stroke="#8bb2df" stroke-width="3"/>
<text x="600" y="170" text-anchor="middle" font-size="27" font-weight="700" fill="#184888">Neurônios KNDy</text>
<text x="600" y="212" text-anchor="middle" font-size="20" fill="#36465d">kisspeptina · neuroquinina B</text>
<text x="600" y="245" text-anchor="middle" font-size="20" fill="#36465d">dinorfina</text>
<path d="M750 215 H870" stroke="#184888" stroke-width="8" marker-end="url(#a)"/>
<rect x="870" y="150" width="250" height="130" rx="22" fill="#fff" stroke="#d7e0ec" stroke-width="3"/>
<text x="995" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#184888">Centro termorregulador</text>
<text x="995" y="235" text-anchor="middle" font-size="20" fill="#46566c">hipotálamo</text>
<path d="M995 280 V390" stroke="#184888" stroke-width="8" marker-end="url(#a)"/>
<rect x="810" y="390" width="370" height="155" rx="24" fill="#fff2f0" stroke="#d98e83" stroke-width="3"/>
<text x="995" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#a63f32">Janela térmica estreita</text>
<text x="995" y="475" text-anchor="middle" font-size="21" fill="#5a4744">pequena variação de temperatura</text>
<text x="995" y="510" text-anchor="middle" font-size="21" fill="#5a4744">→ vasodilatação + sudorese</text>
<rect x="380" y="400" width="330" height="145" rx="24" fill="#eef7f2" stroke="#83b99a" stroke-width="3"/>
<text x="545" y="442" text-anchor="middle" font-size="26" font-weight="700" fill="#2c6d4c">Antagonismo NK3</text>
<text x="545" y="482" text-anchor="middle" font-size="20" fill="#3e594b">reduz sinalização da NKB</text>
<text x="545" y="515" text-anchor="middle" font-size="20" fill="#3e594b">e sintomas vasomotores</text>
<path d="M710 472 H810" stroke="#2c6d4c" stroke-width="7" stroke-dasharray="12 10" marker-end="url(#g)"/>
<text x="600" y="650" text-anchor="middle" font-size="22" fill="#5a6779">Modelo simplificado para raciocínio clínico. Não representa todas as vias neuroendócrinas envolvidas.</text>
</g>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#184888"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2c6d4c"/></marker></defs></svg>