  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#184888">Doppler na restrição do crescimento fetal</text>
  <text x="58" y="102" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">A artéria umbilical é o eixo da vigilância placentária</text><rect x="70" y="170" width="250" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="206" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">AU normal</text><text x="88" y="248" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Resistência placentária</text><text x="88" y="278" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">sem grande alteração</text><rect x="355" y="170" width="250" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="373" y="206" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">IP elevado</text><text x="373" y="248" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Resistência ↑</text><text x="373" y="278" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">diástole presente</text><rect x="640" y="170" width="250" height="150" rx="18" fill="#fffaf0" stroke="#e5c578" stroke-width="2"/><text x="658" y="206" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#9e7419">Diástole ausente</text><text x="658" y="248" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Comprometimento</text><text x="658" y="278" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">placentário grave</text><rect x="925" y="170" width="220" height="150" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="943" y="206" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#b73741">Diástole reversa</text><text x="943" y="248" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Risco elevado</text><text x="943" y="278" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">de deterioração</text><rect x="190" y="400" width="330" height="120" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="208" y="436" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">ACM / CPR</text><text x="208" y="478" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Redistribuição em cenários selecionados</text><rect x="680" y="400" width="330" height="120" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="698" y="436" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">Ducto venoso</text><text x="698" y="478" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Hemodinâmica avançada em RCF precoce grave</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">Timing do parto = idade gestacional + AU + CTG + contexto materno-fetal + protocolo.</text></svg>