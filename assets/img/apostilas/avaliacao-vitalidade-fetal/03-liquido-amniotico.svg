<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#184888">Como medir o líquido amniótico</text>
  <text x="58" y="102" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">MBV e ILA respondem à mesma pergunta por técnicas diferentes</text><rect x="90" y="180" width="460" height="330" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="108" y="216" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">Maior bolsão vertical</text><text x="108" y="258" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Escolha o maior bolsão</text><text x="108" y="288" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">livre de cordão/partes fetais</text><text x="108" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">< 2 cm → oligodrâmnio</text><text x="108" y="348" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">≥ 8 cm → polidrâmnio</text><rect x="650" y="180" width="460" height="330" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="668" y="216" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">Índice de líquido amniótico</text><text x="668" y="258" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Divida em 4 quadrantes</text><text x="668" y="288" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">some o maior bolsão de cada</text><text x="668" y="318" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">≤ 5 cm → oligodrâmnio</text><text x="668" y="348" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">≥ 24–25 cm → polidrâmnio</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">O método deve ser executado de forma padronizada e interpretado com o contexto clínico.</text></svg>