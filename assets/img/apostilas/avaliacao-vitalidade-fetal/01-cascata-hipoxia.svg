<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#184888">Hipóxia fetal: o que se altera primeiro?</text>
  <text x="58" y="102" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">A vigilância fetal observa etapas diferentes da mesma cascata</text><rect x="60" y="175" width="210" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="78" y="211" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">1. Placenta</text><text x="78" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">↓ oferta de O₂</text><text x="78" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">↑ resistência</text><rect x="295" y="175" width="210" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="313" y="211" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">2. Adaptação</text><text x="313" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Redistribuição</text><text x="313" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">cérebro/coração</text><rect x="530" y="175" width="210" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="548" y="211" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">3. Biofísica</text><text x="548" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">↓ movimentos</text><text x="548" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">↓ respiração</text><rect x="765" y="175" width="210" height="150" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="783" y="211" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">4. FCF</text><text x="783" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">↓ reatividade</text><text x="783" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">desacelerações</text><rect x="1000" y="175" width="140" height="150" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="1018" y="211" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#b73741">5. Falência</text><text x="1018" y="253" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Acidemia</text><text x="1018" y="283" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">óbito</text><rect x="125" y="400" width="270" height="120" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="143" y="436" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">Doppler AU</text><text x="143" y="478" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Resistência placentária</text><rect x="465" y="400" width="270" height="120" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="483" y="436" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">PBF / movimentos</text><text x="483" y="478" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Atividade fetal</text><rect x="805" y="400" width="270" height="120" rx="18" fill="#fff" stroke="#bfd0e4" stroke-width="2"/><text x="823" y="436" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#184888">CTG</text><text x="823" y="478" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#10243e">Resposta autonômica</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">Nenhum método responde sozinho a todas as etapas.</text></svg>