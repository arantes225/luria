<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Placentação normal × pré-eclâmpsia</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">O ponto-chave é o remodelamento das artérias espiraladas</text><rect x="80" y="180" width="470" height="340" rx="18" fill="#f1fbf6" stroke="#96c8ad" stroke-width="2"/><text x="98" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#23805a">Gestação normal</text><text x="98" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Artérias espiraladas amplas</text><text x="98" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">baixa resistência</text><text x="98" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">fluxo uteroplacentário adequado</text><rect x="650" y="180" width="470" height="340" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="668" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Pré-eclâmpsia</text><text x="668" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Remodelamento incompleto</text><text x="668" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">alta resistência</text><text x="668" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">hipoperfusão / estresse placentário</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">O problema começa na interface materno-placentária e depois se torna sistêmico.</text></svg>