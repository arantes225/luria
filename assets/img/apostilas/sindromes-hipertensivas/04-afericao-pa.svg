<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Aferição correta da pressão arterial na gestação</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Evite classificar gravidade por técnica inadequada</text><rect x="55" y="180" width="255" height="310" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="73" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">1. Repouso</text><text x="73" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">≥ 5 minutos</text><text x="73" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">sentada e costas apoiadas</text><rect x="345" y="180" width="255" height="310" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="363" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">2. Posição</text><text x="363" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Braço na altura</text><text x="363" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">do coração</text><rect x="635" y="180" width="255" height="310" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="653" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">3. Manguito</text><text x="653" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Tamanho adequado</text><text x="653" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">à circunferência do braço</text><rect x="925" y="180" width="220" height="310" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="943" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">4. Confirmar</text><text x="943" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Repetir medida</text><text x="943" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">sem atrasar tratamento</text><text x="943" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">se PA grave</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">A técnica correta evita falso diagnóstico de hipertensão grave.</text></svg>