<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Síndromes hipertensivas da gestação</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Organize pela cronologia e pela presença de lesão de órgão-alvo</text><rect x="70" y="155" width="1060" height="95" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="191" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Hipertensão crônica</text><text x="88" y="233" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Antes de 20 semanas, prévia à gestação ou persistente no pós-parto</text><rect x="70" y="270" width="1060" height="95" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="306" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Hipertensão gestacional</text><text x="88" y="348" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Após 20 semanas, sem proteinúria nem disfunção de órgão-alvo</text><rect x="70" y="385" width="1060" height="95" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="421" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Pré-eclâmpsia</text><text x="88" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Hipertensão após 20 semanas + proteinúria e/ou disfunção materna</text><rect x="70" y="500" width="1060" height="95" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="536" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Pré-eclâmpsia sobreposta</text><text x="88" y="578" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Hipertensão crônica + nova proteinúria, piora abrupta ou lesão de órgão-alvo</text></svg>