<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Síndrome HELLP</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Hemólise + elevação de enzimas hepáticas + plaquetopenia</text><rect x="75" y="185" width="300" height="330" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="93" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">H — Hemólise</text><text x="93" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">↑ LDH</text><text x="93" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">esquizócitos</text><text x="93" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">bilirrubina indireta ↑</text><rect x="450" y="185" width="300" height="330" rx="18" fill="#fffaf0" stroke="#e5c578" stroke-width="2"/><text x="468" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#9e7419">EL — Enzimas hepáticas</text><text x="468" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">TGO/TGP elevadas</text><text x="468" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">± dor em HD</text><text x="468" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">± náuseas / mal-estar</text><rect x="825" y="185" width="300" height="330" rx="18" fill="#eef4fb" stroke="#9fb8d5" stroke-width="2"/><text x="843" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">LP — Plaquetas baixas</text><text x="843" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Plaquetopenia</text><text x="843" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">frequentemente progressiva</text><text x="843" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">risco hemorrágico</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">HELLP pode surgir mesmo sem proteinúria exuberante.</text></svg>