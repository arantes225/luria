<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Prevenção de pré-eclâmpsia em gestantes de risco</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Intervenções antes do aparecimento da síndrome</text><rect x="90" y="185" width="460" height="330" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="108" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">AAS em baixa dose</text><text x="108" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Iniciar preferencialmente</text><text x="108" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">entre 12–16 semanas</text><text x="108" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">quando houver indicação</text><rect x="650" y="185" width="460" height="330" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="668" y="221" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Cálcio</text><text x="668" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Suplementar quando</text><text x="668" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">a ingestão dietética for baixa</text><text x="668" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">conforme protocolo</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">Identifique fatores de risco já na primeira consulta de pré-natal.</text></svg>