<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Pré-eclâmpsia: da placenta à disfunção sistêmica</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Esquema fisiopatológico simplificado</text><rect x="55" y="175" width="250" height="130" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="73" y="211" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Placentação anormal</text><text x="73" y="253" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Remodelamento incompleto</text><text x="73" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">das artérias espiraladas</text><rect x="330" y="175" width="250" height="130" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="348" y="211" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Estresse placentário</text><text x="348" y="253" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Hipóxia relativa</text><text x="348" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">e lesão vascular</text><rect x="605" y="175" width="250" height="130" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="623" y="211" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Desequilíbrio angiogênico</text><text x="623" y="253" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">↑ sFlt-1 / endoglina</text><text x="623" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">↓ VEGF / PlGF</text><rect x="880" y="175" width="265" height="130" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="898" y="211" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Disfunção endotelial</text><text x="898" y="253" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Vasoconstrição</text><text x="898" y="284" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">e permeabilidade ↑</text><rect x="80" y="385" width="230" height="125" rx="18" fill="#eef4fb" stroke="#bfd0e4" stroke-width="2"/><text x="98" y="421" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Hipertensão</text><text x="98" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Vasoespasmo sistêmico</text><rect x="355" y="385" width="230" height="125" rx="18" fill="#eef4fb" stroke="#bfd0e4" stroke-width="2"/><text x="373" y="421" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Rim</text><text x="373" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Proteinúria / creatinina</text><rect x="630" y="385" width="230" height="125" rx="18" fill="#eef4fb" stroke="#bfd0e4" stroke-width="2"/><text x="648" y="421" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Cérebro</text><text x="648" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Cefaleia / eclâmpsia</text><rect x="905" y="385" width="230" height="125" rx="18" fill="#eef4fb" stroke="#bfd0e4" stroke-width="2"/><text x="923" y="421" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Fígado / sangue</text><text x="923" y="463" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">HELLP / dor em HD</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">A placenta inicia a cascata; a síndrome clínica é sistêmica.</text></svg>