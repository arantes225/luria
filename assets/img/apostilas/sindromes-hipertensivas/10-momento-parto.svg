<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Pré-eclâmpsia: lógica do momento do parto</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">O tratamento definitivo é o término da gestação; o timing depende do risco</text><rect x="55" y="170" width="320" height="140" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="73" y="206" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Sem sinais de gravidade</text><text x="73" y="248" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">&lt; 37 semanas</text><text x="73" y="279" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Vigilância materno-fetal</text><rect x="440" y="170" width="320" height="140" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="458" y="206" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Com sinais de gravidade</text><text x="458" y="248" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">&lt; 34 semanas</text><text x="458" y="279" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Expectante só em casos selecionados</text><rect x="825" y="170" width="320" height="140" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="843" y="206" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">≥ 37 semanas</text><text x="843" y="248" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">ou deterioração</text><text x="843" y="279" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Estabilizar e resolver</text><rect x="55" y="390" width="320" height="140" rx="18" fill="#f1fbf6" stroke="#96c8ad" stroke-width="2"/><text x="73" y="426" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#23805a">Meta</text><text x="73" y="468" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Chegar a 37 semanas</text><text x="73" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">se mãe e feto estiverem estáveis</text><rect x="440" y="390" width="320" height="140" rx="18" fill="#fffaf0" stroke="#e5c578" stroke-width="2"/><text x="458" y="426" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#9e7419">Meta</text><text x="458" y="468" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Ganhar tempo apenas</text><text x="458" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">se o benefício superar o risco</text><rect x="825" y="390" width="320" height="140" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="843" y="426" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Meta</text><text x="843" y="468" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Não atrasar o parto</text><text x="843" y="499" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">quando há indicação materna/fetal</text></svg>