<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Sulfato de magnésio</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Anticonvulsivante — não é anti-hipertensivo</text><rect x="70" y="180" width="480" height="330" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="88" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Esquema IV — Zuspan</text><text x="88" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Ataque: 4–6 g IV</text><text x="88" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">em 20–30 min</text><text x="88" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Manutenção: 1–2 g/h</text><rect x="650" y="180" width="480" height="330" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="668" y="216" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Monitorização</text><text x="668" y="258" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Reflexo patelar</text><text x="668" y="289" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Frequência respiratória</text><text x="668" y="320" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Diurese / consciência</text><text x="668" y="351" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Antídoto: gluconato de cálcio</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">Usado para prevenção e tratamento de convulsões na pré-eclâmpsia grave/eclâmpsia.</text></svg>