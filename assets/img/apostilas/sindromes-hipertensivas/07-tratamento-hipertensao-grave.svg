<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Hipertensão aguda grave na gestação</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">PAS ≥160 ou PAD ≥110 mmHg persistente exige tratamento rápido</text><rect x="75" y="165" width="1050" height="95" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="93" y="201" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Objetivo</text><text x="93" y="243" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Reduzir rapidamente o risco de AVC materno sem provocar hipotensão abrupta</text><rect x="75" y="330" width="300" height="190" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="93" y="366" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Nifedipino VO</text><text x="93" y="408" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">10 mg</text><text x="93" y="439" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">repetir conforme protocolo</text><rect x="450" y="330" width="300" height="190" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="468" y="366" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Hidralazina IV</text><text x="468" y="408" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">5–10 mg</text><text x="468" y="439" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">repetir conforme resposta</text><rect x="825" y="330" width="300" height="190" rx="18" fill="#ffffff" stroke="#bfd0e4" stroke-width="2"/><text x="843" y="366" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#184888">Labetalol IV</text><text x="843" y="408" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">20 → 40 → 80 mg</text><text x="843" y="439" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">conforme protocolo</text><text x="60" y="635" font-family="Arial,sans-serif" font-size="18" fill="#5a697d">Escolha conforme disponibilidade, contraindicações e protocolo institucional.</text></svg>