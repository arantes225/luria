<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f8fafd"/>
  <text x="55" y="70" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#184888">Pré-eclâmpsia: sinais de gravidade</text>
  <text x="58" y="105" font-family="Arial,sans-serif" font-size="20" fill="#5a697d">Qualquer um deles muda vigilância, tratamento e momento do parto</text><rect x="60" y="165" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="78" y="201" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">PA ≥ 160/110 mmHg</text><text x="78" y="243" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Hipertensão aguda grave persistente</text><rect x="620" y="165" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="638" y="201" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Plaquetas &lt; 100.000/mm³</text><text x="638" y="243" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Trombocitopenia</text><rect x="60" y="305" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="78" y="341" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Creatinina &gt; 1,1 mg/dL</text><text x="78" y="383" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Ou duplicação sem outra causa</text><rect x="620" y="305" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="638" y="341" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">TGO/TGP ≥ 2× o limite</text><text x="638" y="383" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">± dor epigástrica / hipocôndrio direito</text><rect x="60" y="445" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="78" y="481" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Edema pulmonar</text><text x="78" y="523" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Comprometimento respiratório</text><rect x="620" y="445" width="520" height="110" rx="18" fill="#fff5f5" stroke="#deb0b4" stroke-width="2"/><text x="638" y="481" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#b73741">Sintomas neurológicos</text><text x="638" y="523" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#10243e">Cefaleia refratária, escotomas, alterações visuais</text></svg>