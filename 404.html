<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'sha256-xBYxZa063tWmlgy+RkNC3X65WXoqKJJWWYvMNThPsng='; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; worker-src 'none'; media-src 'none'; frame-src 'none'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TRAUBE</title>
  <style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fc;color:#10243e}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}p{color:#66768a}</style>
</head>
<body>
  <main><div><strong>TRAUBE</strong><p>Abrindo…</p></div></main>
  <script>
    (function(){
      try{
        var path=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,""));
        if(/^[a-zA-Z0-9][a-zA-Z0-9._-]{2,29}$/.test(path)){
          location.replace("/trabalho/prontuario/#u="+encodeURIComponent(path.toLowerCase()));
          return;
        }
      }catch(e){}
      document.querySelector("p").textContent="Página não encontrada.";
    })();
  </script>
</body>
</html>
