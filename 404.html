<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>LURIA</title>
  <style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f9fc;color:#10243e}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}p{color:#66768a}</style>
</head>
<body>
  <main><div><strong>LURIA</strong><p>Abrindo…</p></div></main>
  <script>
    (function(){
      try{
        var path=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,""));
        if(/^[a-zA-Z0-9][a-zA-Z0-9._-]{2,29}$/.test(path)){
          location.replace("/trabalho/prontuario/#u="+encodeURIComponent(path.toLowerCase()));
          return;
        }
      }catch(e){}
      document.querySelector("p").textContent="Página não encontrada.";
    })();
  </script>
</body>
</html>
