  <style>
    .books-page{display:grid;gap:14px;padding-bottom:30px}
    .books-page>.luria-page-spotlight{margin:0!important}
    .books-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
    .books-search{flex:1 1 520px;max-width:620px}
    .books-search input{width:100%;height:44px;min-height:44px;padding:0 15px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:10px;outline:none;box-sizing:border-box}
    .books-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .books-search-count{color:var(--muted);font-size:9px;white-space:nowrap}

    .library-section{display:grid;gap:10px;padding:16px 18px;border:1px solid var(--border);border-radius:15px;background:var(--surface);overflow:hidden}
    .library-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
    .library-section-head>div{min-width:0}
    .library-section-eyebrow{display:block;margin-bottom:3px;color:var(--accent);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase}
    .library-section h2{margin:0;font-size:16px;line-height:1.2;font-weight:500;color:var(--text)}
    .library-section-head small{color:var(--muted);font-size:9px}
    .library-empty{padding:18px;border:1px dashed var(--border);border-radius:11px;color:var(--muted);font-size:10px;text-align:center}

    .books-row{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:3px 2px 8px;scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--accent) 55%,transparent) transparent}
    .books-row::-webkit-scrollbar{height:7px}.books-row::-webkit-scrollbar-track{background:transparent}.books-row::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 55%,transparent);border-radius:999px}
    .book-card{flex:0 0 210px;width:210px;min-height:190px;padding:17px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--text);overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 4%,var(--surface)),var(--surface) 58%);border:1.5px solid color-mix(in srgb,var(--accent) 44%,var(--border));border-left:5px solid var(--accent);border-radius:13px;box-shadow:none}
    .book-card:hover{border-color:color-mix(in srgb,var(--accent) 62%,var(--border));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
    .book-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .book-card-icon{width:35px;height:35px;min-width:35px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
    .book-card-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .book-meta{display:flex;flex:1;flex-direction:column;margin-top:9px;padding:0}
    .book-area{display:block;color:var(--muted);font-size:8.8px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .book-subarea{display:block;margin-top:3px;color:var(--accent);font-size:9px;line-height:1.2;font-weight:500}
    .book-title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 0;color:var(--text);font-size:14px;line-height:1.18;font-weight:600}
    .book-foot{margin-top:auto;padding-top:12px;color:var(--muted);font-size:8.8px}

    .area-block{display:grid;gap:10px}
    .area-block+.area-block{margin-top:4px}
    .area-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px}
    .area-title h3{margin:0;font-size:13px;font-weight:500;color:var(--text)}
    .area-title span{font-size:8.5px;color:var(--muted)}
    .subarea-block{display:grid;gap:7px}
    .subarea-label{margin:0 2px;color:var(--accent);font-size:9px;font-weight:600}
    #area-library{display:grid;gap:14px}
    .books-no-results{padding:24px;border:1px dashed var(--border);border-radius:13px;color:var(--muted);font-size:10px;text-align:center;background:var(--surface)}

    @media(max-width:700px){
      .books-toolbar{align-items:stretch;flex-direction:column}
      .books-search{max-width:none;flex-basis:auto}
      .book-card{flex-basis:190px;width:190px}
      .library-section{padding:14px}
    }
  </style>
</head>
<body data-page="aprender">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside><div id="sidebar-backdrop" class="sidebar-backdrop"></div>
    <main class="main"><div class="page">
      <header class="topbar"><button id="menu-open" class="menu-open" type="button" aria-label="Abrir menu">☰</button><div class="page-heading"><span class="eyebrow">Conteúdo LURIA</span><h1>Apostilas</h1></div></header>
      <section class="books-page">
        <section class="luria-page-spotlight" aria-label="Apostilas">
          <div class="luria-page-spotlight-copy">
            <strong>Apostilas</strong>
            <small>Biblioteca de estudo organizada por área, matéria e tema.</small>
          </div>
        </section>

        <section class="books-toolbar" aria-label="Buscar apostilas">
          <label class="books-search">
            <input id="books-search-input" type="search" placeholder="Buscar tema, matéria ou área..." autocomplete="off">
          </label>
          <span class="books-search-count" id="books-search-count">Carregando...</span>
        </section>

        <section class="library-section" id="recent-section">
          <div class="library-section-head">
            <div><span class="library-section-eyebrow">Mais recentes</span><h2>Últimas criadas</h2></div>
            <small id="recent-count"></small>
          </div>
          <div class="books-row" id="recent-grid"></div>
        </section>

        <section class="library-section">
          <div class="library-section-head">
            <div><span class="library-section-eyebrow">Biblioteca</span><h2>Por área</h2></div>
            <small id="library-count"></small>
          </div>
          <div id="area-library"></div>
        </section>
      </section>
    </div></main>
  </div>
  <script src="/assets/vendor/supabase-2.110.6.js"></script>
  <script src="/assets/js/supabase.js?v=auth4"></script>
  <script src="/assets/js/app.js?v=20261004-global-shell-v74"></script>
  <script>
  (()=>{"use strict";
    const sb=window.supabaseClient;
    const pilot={
      id:"pilot-dmg",
      area:"Ginecologia e Obstetrícia",
      materia:"Obstetrícia",
      tema:"Diabetes Mellitus Gestacional",
      titulo:"Diabetes Mellitus Gestacional",
      content_url:"/apostilas/diabetes-mellitus-gestacional/",
      created_at:"2026-10-05T00:00:00Z"
    };
    const somp={
      id:"somp-2026",
      area:"Ginecologia e Obstetrícia",
      materia:"Endocrinologia Ginecológica",
      tema:"Síndrome Ovariana Metabólica Poliendócrina",
      titulo:"Síndrome Ovariana Metabólica Poliendócrina",
      content_url:"/apostilas/sindrome-ovariana-metabolica-poliendocrina-somp/",
      created_at:"2026-10-05T22:28:00-03:00"
    };
    const parto={
      id:"assistencia-parto-2026",
      area:"Ginecologia e Obstetrícia",
      materia:"Obstetrícia",
      tema:"Assistência ao Parto, Vigilância Intraparto e Partograma",
      titulo:"Assistência ao Parto, Vigilância Intraparto e Partograma",
      content_url:"/apostilas/assistencia-ao-parto/",
      created_at:"2026-10-06T01:30:00-03:00"
    };
    const hipertensaoGestacao={
      id:"sindromes-hipertensivas-gestacao-2026",
      area:"Ginecologia e Obstetrícia",
      materia:"Obstetrícia",
      tema:"Síndromes hipertensivas da gestação",
      titulo:"Síndromes hipertensivas da gestação",
      content_url:"/apostilas/sindromes-hipertensivas-da-gestacao/",
      created_at:"2026-10-07T14:28:00-03:00"
    };
    const climaterioMenopausa={
      id:"climaterio-menopausa-2026",
      area:"Ginecologia e Obstetrícia",
      materia:"Saúde da Mulher",
      tema:"Climatério e Menopausa",
      titulo:"Climatério e Menopausa",
      content_url:"/apostilas/climaterio-menopausa/",
      created_at:"2026-10-07T15:18:00-03:00"
    };
    const cancerColo={
      id:"cancer-colo-hpv-2026",
      area:"Ginecologia e Obstetrícia",
      materia:"Oncoginecologia",
      tema:"Câncer do colo do útero e HPV",
      titulo:"Câncer do colo do útero e HPV",
      content_url:"/apostilas/cancer-colo-utero-hpv/",
      created_at:"2026-10-07T15:18:00-03:00"
    };
    const areaOrder=["Clínica Médica","Cirurgia Geral","Ginecologia e Obstetrícia","Pediatria","Medicina Preventiva / MFC"];
    const norm=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
    const bookIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H11v18H6.5A2.5 2.5 0 0 0 4 22.5v-18Z"/><path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H13v18h4.5a2.5 2.5 0 0 1 2.5 2.5v-18Z"/></svg>';
    let books=[];

    function card(book){
      const a=document.createElement("a");
      a.className="book-card";
      a.href=book.content_url||"#";
      a.dataset.search=norm([book.area,book.materia,book.tema,book.titulo].filter(Boolean).join(" "));
      a.innerHTML='<div class="book-card-top"><span class="book-card-icon">'+bookIcon+'</span></div><div class="book-meta"><span class="book-area"></span><span class="book-subarea"></span><strong class="book-title"></strong><small class="book-foot">Apostila LURIA</small></div>';
      a.querySelector(".book-area").textContent=book.area||"Sem área";
      a.querySelector(".book-subarea").textContent=book.materia||"";
      a.querySelector(".book-title").textContent=book.tema||book.titulo||"Apostila";
      return a;
    }

    function recentBooks(){
      return [...books]
        .sort((a,b)=>{
          const ad=Date.parse(a.created_at||0)||0;
          const bd=Date.parse(b.created_at||0)||0;
          return bd-ad;
        })
        .slice(0,6);
    }

    function renderRecent(query=""){
      const root=document.getElementById("recent-grid");
      const section=document.getElementById("recent-section");
      const q=norm(query);
      const items=recentBooks().filter(book=>!q||norm([book.area,book.materia,book.tema,book.titulo].join(" ")).includes(q));
      root.innerHTML="";
      if(!items.length){
        section.hidden=!!q;
        if(!q)root.innerHTML='<div class="library-empty">As apostilas criadas mais recentemente aparecerão aqui.</div>';
      }else{
        section.hidden=false;
        items.forEach(book=>root.appendChild(card(book)));
      }
      document.getElementById("recent-count").textContent=items.length?items.length+" criada"+(items.length===1?"":"s"):"";
    }

    function renderAreas(query=""){
      const root=document.getElementById("area-library");
      const q=norm(query);
      const filtered=books.filter(book=>!q||norm([book.area,book.materia,book.tema,book.titulo].join(" ")).includes(q));
      root.innerHTML="";
      if(!filtered.length){
        root.innerHTML='<div class="books-no-results">Nenhuma apostila encontrada para essa busca.</div>';
        return;
      }
      const grouped=new Map();
      filtered.forEach(book=>{
        const area=book.area||"Sem área";
        const materia=book.materia||"Outros";
        if(!grouped.has(area))grouped.set(area,new Map());
        if(!grouped.get(area).has(materia))grouped.get(area).set(materia,[]);
        grouped.get(area).get(materia).push(book);
      });
      [...grouped.keys()].sort((a,b)=>{
        const ai=areaOrder.indexOf(a),bi=areaOrder.indexOf(b);
        if(ai<0&&bi<0)return a.localeCompare(b,"pt-BR");
        if(ai<0)return 1;if(bi<0)return -1;return ai-bi;
      }).forEach(area=>{
        const areaBlock=document.createElement("section");
        areaBlock.className="area-block";
        const count=[...grouped.get(area).values()].reduce((n,arr)=>n+arr.length,0);
        areaBlock.innerHTML='<div class="area-title"><h3></h3><span></span></div>';
        areaBlock.querySelector("h3").textContent=area;
        areaBlock.querySelector("span").textContent=count+" apostila"+(count===1?"":"s");
        [...grouped.get(area).keys()].sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(materia=>{
          const sub=document.createElement("div");
          sub.className="subarea-block";
          const label=document.createElement("div");
          label.className="subarea-label";
          label.textContent=materia;
          const row=document.createElement("div");
          row.className="books-row";
          grouped.get(area).get(materia).forEach(book=>row.appendChild(card(book)));
          sub.append(label,row);
          areaBlock.appendChild(sub);
        });
        root.appendChild(areaBlock);
      });
    }

    function render(query=""){
      renderRecent(query);
      renderAreas(query);
      const q=norm(query);
      const total=books.filter(book=>!q||norm([book.area,book.materia,book.tema,book.titulo].join(" ")).includes(q)).length;
      document.getElementById("library-count").textContent=books.length+" apostila"+(books.length===1?"":"s");
      document.getElementById("books-search-count").textContent=q?(total+" resultado"+(total===1?"":"s")):(books.length+" apostila"+(books.length===1?"":"s"));
    }

    async function loadBooks(){
      let remote=[];
      try{
        if(sb){
          const {data,error}=await sb.from("apostilas").select("id,area,materia,tema,titulo,content_url,is_published,created_at").eq("is_published",true).order("created_at",{ascending:false});
          if(!error&&Array.isArray(data))remote=data;
        }
      }catch{}
      const byUrl=new Map();
      [climaterioMenopausa,hipertensaoGestacao,parto,somp,pilot,...remote].forEach(book=>{if(book.content_url&&!byUrl.has(book.content_url))byUrl.set(book.content_url,book)});
      books=[...byUrl.values()].sort((a,b)=>(Date.parse(b.created_at||0)||0)-(Date.parse(a.created_at||0)||0));
      render("");
    }

    document.getElementById("books-search-input")?.addEventListener("input",event=>render(event.target.value));
    loadBooks();
  })();
  </script>
  <script defer src="/assets/js/pwa.js?v=6-apostilas-library-fix"></script>
</body>
</html>
