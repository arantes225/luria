<body class="auth-page">

      class="auth-form"
    >

        E-mail

          type="email"
          autocomplete="email"
          placeholder="voce@email.com"
          required
        >
      </label>

        <div style="position: relative; display: flex; align-items: center;">
          <input
            id="senha"
            type="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            required
            style="padding-right: 40px;"
          >
          <button
            type="button"
            id="toggle-password"
            aria-label="Mostrar senha"
            aria-pressed="false"
            style="position: absolute; right: 14px; background: transparent; border: none; cursor: pointer; padding: 0; display: flex; color: var(--muted);"
          >

          </button>
        </div>
      </div>

      <label class="auth-remember">
        <input
          id="lembrar"
          type="checkbox"
          checked
        >
        <span>Lembrar de mim neste navegador</span>
      </label>

      <button
        id="entrar"
        class="button primary"
        type="submit"
      >
        Entrar
      </button>

      <button
        id="entrar-google"
        class="button secondary auth-google-btn"
        type="button"
        style="display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700;"

        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">

      </button>

      <button
        id="passkey-login"
        class="button secondary"
        type="button"
        hidden
      >
        Entrar com Face ID / Passkey
      </button>

      <button
        id="criar-conta"
        class="button secondary"
        type="button"
      >
        Criar conta
      </button>

      <p
        id="mensagem"
        class="auth-message"
        aria-live="polite"
      ></p>
